<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>订单管理系统</title>
  <style>
    :root{--bg:#f4f6fa;--card:#fff;--line:#e5e9f2;--text:#1f2d3d;--muted:#6b7a90;--p:#1677ff;--p2:#e8f3ff;--d:#d4380d;--d2:#fff2f0;--s:#f2f4f8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .hidden{display:none!important}
    .field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
    input,select,button{width:100%;min-height:36px;border:1px solid #cfd6e3;border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
    button{cursor:pointer;font-weight:600}
    .row{display:flex;gap:8px}.btn-p{background:var(--p);border-color:var(--p);color:#fff}.btn-s{background:var(--s)}.btn-d{background:var(--d2);border-color:#ffccc7;color:var(--d)}
    .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,40px);background:linear-gradient(165deg,#f8fafc 0%,#f1f5f9 40%,#eef2ff 100%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
    .auth-card-v2{width:100%;max-width:400px;background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:clamp(24px,5vw,36px);box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .auth-brand{font-size:1.35rem;font-weight:650;letter-spacing:-.02em;color:#0f172a;margin:0 0 6px}
    .auth-sub{font-size:13px;color:#64748b;margin:0 0 22px;line-height:1.45}
    .auth-tabs{display:flex;gap:4px;padding:4px;background:#f1f5f9;border-radius:12px;margin-bottom:22px}
    .auth-tab{flex:1;border:none;background:transparent;color:#64748b;font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s ease,color .15s ease}
    .auth-tab:hover{color:#334155}
    .auth-tab.active{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(15,23,42,.07)}
    .auth-field{margin-bottom:16px}
    .auth-field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px}
    .auth-input{width:100%;min-height:44px;border:1px solid #e2e8f0;border-radius:10px;padding:0 14px;font-size:15px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease;box-sizing:border-box}
    .auth-input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
    .auth-pass-wrap{position:relative}
    .auth-pass-wrap .auth-input{padding-right:92px}
    .auth-toggle-pwd{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#f8fafc;color:#475569;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background .15s ease,color .15s ease;width:auto;min-height:auto}
    .auth-toggle-pwd:hover{background:#e2e8f0;color:#0f172a}
    .auth-primary{width:100%;min-height:46px;border:none;border-radius:12px;background:#4f46e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .15s ease,opacity .15s ease,transform .06s ease;box-sizing:border-box}
    .auth-primary:hover:not(:disabled){background:#4338ca}
    .auth-primary:active:not(:disabled){transform:scale(.995)}
    .auth-primary:disabled{opacity:.55;cursor:not-allowed}
    .auth-banner{margin-top:14px;padding:12px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;font-size:13px;color:#166534;line-height:1.55;display:none}
    .auth-banner.show{display:block}
    .auth-banner strong{color:#14532d;font-weight:650}
    .auth-footer{margin-top:18px;text-align:center;font-size:13px;color:#64748b;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
    .auth-link{background:none;border:none;padding:0;color:#4f46e5;font-weight:600;cursor:pointer;font-size:inherit;text-decoration:underline;text-underline-offset:3px;width:auto;min-height:auto}
    .auth-link:hover{color:#4338ca}
    .auth-link:disabled{opacity:.45;cursor:not-allowed;text-decoration:none;color:#94a3b8}
    .auth-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120%);max-width:min(400px,calc(100vw - 32px));padding:12px 18px;background:#0f172a;color:#f8fafc;font-size:14px;font-weight:500;border-radius:12px;box-shadow:0 10px 40px rgba(15,23,42,.2);z-index:10000;opacity:0;transition:opacity .22s ease,transform .22s ease;pointer-events:none;line-height:1.45}
    .auth-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .auth-toast.err{background:#991b1b;color:#fef2f2}
    .layout{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
    aside{background:#0f172a;color:#d7e0ee;padding:18px 12px}
    .brand{font-weight:700;color:#fff;margin:0 8px 16px}
    .menu{width:100%;text-align:left;background:transparent;color:#d7e0ee;border:1px solid transparent;border-radius:8px;min-height:40px;padding:0 10px;margin-bottom:8px}
    .menu.active{background:#1e293b;border-color:#334155;color:#fff}
    main{padding:18px 20px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .top h1{margin:0;font-size:22px}.muted{color:var(--muted)}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
    .hd{padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbff;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .bd{padding:14px}
    .btn-mini{width:auto;min-height:30px;padding:0 8px;font-size:12px}
    .order-items-table{table-layout:fixed;width:100%;min-width:0}
    .order-items-table th,.order-items-table td{text-align:center!important;vertical-align:middle}
    .order-items-table .col-name{width:22%}
    .order-items-table .col-spec{width:22%}
    .order-items-table .col-qty{width:14%}
    .order-items-table .col-price{width:18%}
    .order-items-table .col-total{width:14%}
    .order-items-table .col-op{width:10%}
    .order-items-table .i-total{white-space:nowrap}
    .order-items-table .i-total .ellipsis{display:inline-block;max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .order-items-table input{text-align:center}
    .wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:840px}
    th,td{border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px;white-space:nowrap;text-align:left}
    th{background:#f8faff;color:#384861}
    tr:hover td{background:#f8fbff}
    .center{text-align:center}.right{text-align:right}
    .tag{display:inline-flex;border-radius:999px;padding:2px 10px;font-size:12px}
    .t-pending{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .t-shipped{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .t-done{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    .progress{display:flex;align-items:center;gap:8px}
    .bar{height:8px;background:#ecf0f7;border-radius:999px;overflow:hidden;min-width:100px}
    .bar span{display:block;height:100%;background:var(--p)}
    .detail{display:grid;grid-template-columns:1fr 220px;gap:14px}
    .inline-detail-row td{background:#fff!important;padding:0;border-bottom:1px solid var(--line)}
    .inline-detail-box{
      margin:12px;
      padding:16px;
      border:1px solid #dbe3ef;
      border-radius:12px;
      background:#f8f9fa;
    }
    .inline-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .inline-section{
      border:1px solid #e1e8f2;
      border-radius:10px;
      background:#fff;
      padding:12px;
      margin-top:12px;
    }
    .inline-section h4{margin:0 0 10px;font-size:14px}
    .inline-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
    .edit-input {
      width: 100%;
      min-width: 80px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
    }
    .edit-textarea {
      width: 100%;
      min-width: 120px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      resize: vertical;
    }
    .sticky{position:sticky;top:18px;display:flex;flex-direction:column;gap:8px}
    .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .sum .cell{border:1px solid var(--line);background:#f9fbff;border-radius:8px;padding:10px}
    .sum .k{font-size:12px;color:var(--muted)}.sum .v{font-size:18px;font-weight:700;margin-top:4px}
    .timeline{border-left:2px solid #d7e3f7;margin-left:10px;padding-left:12px;margin-bottom:12px;position:relative}
    .timeline:before{content:"";position:absolute;left:-7px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--p)}
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:14px;z-index:99}
    .modal.show{display:flex}.box{width:min(920px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
    .mhd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;background:#fafbff}
    .mbd{padding:14px}.mft{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    .m-card{background:#fff;border:1px solid #e8edf5;border-radius:16px;box-shadow:none}
    #customerModal input,#customerModal textarea,#customerModal select{border:1px solid #d5dbe7;border-radius:8px;min-height:44px;padding:0 12px}
    #customerModal textarea{padding:10px 12px}
    #customerModal button{min-height:44px}

    /* desktop orders: collapse cards */
    .orders-cards{display:grid;gap:12px}
    .order-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .order-card-hd{padding:12px 14px;background:#fafbff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
    .order-card-title{min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .order-card-title .name{font-weight:800;font-size:15px;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .order-card-title .sub{color:var(--muted);font-size:12px}
    .order-card-actions{display:flex;gap:8px;align-items:center}
    .order-card-bd{padding:14px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .ship-form{margin-top:12px;border:1px solid #e1e8f2;border-radius:12px;background:#fff;padding:12px}
    .ship-form h4{margin:0 0 10px;font-size:14px}
    .ship-form .row{align-items:flex-end}
    .ship-items{display:grid;gap:8px;margin-top:10px}
    .ship-item-row{display:grid;grid-template-columns:1.2fr .9fr .7fr .7fr 1fr;gap:10px;align-items:center}
    .ship-item-row .muted{font-size:12px}
    .ship-item-row input{min-height:34px}
    .stat-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .stat-filter .field{margin:0}
    .stat-filter select,.stat-filter input{min-width:200px;width:auto}
    .stat-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
    .stat-summary .cell{border:1px solid var(--line);background:#f9fbff;border-radius:10px;padding:12px}
    .stat-summary .k{font-size:12px;color:var(--muted)}
    .stat-summary .v{font-size:20px;font-weight:900;margin-top:6px}
    @media (max-width:980px){.layout{grid-template-columns:1fr}aside{display:flex;gap:8px;padding:10px}.brand{margin:0}.menu{width:auto;min-height:34px;margin:0}.detail{grid-template-columns:1fr}.sticky{position:static;flex-direction:row;flex-wrap:wrap}.sum{grid-template-columns:1fr}.inline-detail-grid{grid-template-columns:1fr}}
    @media (max-width:768px){
      html,body{height:100%}
      body.mobile-mode{overflow:hidden;background:#f5f7fb}
      .mobile-container{position:fixed;inset:0;background:#f5f7fb}
      .mobile-header{position:fixed;left:0;right:0;top:0;height:56px;min-height:56px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:rgba(255,255,255,.95);border-bottom:1px solid #e8edf5;backdrop-filter:blur(8px);z-index:20;padding-top:constant(safe-area-inset-top);padding-top:env(safe-area-inset-top)}
      .mobile-header .mobile-header-inner{width:100%;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
      .mobile-header .mobile-header-title{min-width:0;flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .mobile-header .mobile-header-user{max-width:42vw;font-size:12px;color:#6b7a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #mobileContent{position:fixed;left:0;right:0;top:56px;bottom:78px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px}
      .mobile-bottom-wrap{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:transparent;z-index:20}
      .mobile-bottom-nav{background:rgba(255,255,255,.92);border:1px solid #e8edf5;border-radius:18px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;backdrop-filter:blur(10px);padding-bottom:constant(safe-area-inset-bottom);padding-bottom:env(safe-area-inset-bottom)}
      .mobile-tab-btn{height:52px;border:none;border-radius:12px;background:transparent;color:#6b7a90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px}
      .mobile-tab-btn.active{background:#e8f0fe;color:#1677ff;font-weight:600}
      .mobile-card{background:#fff;border:1px solid #e8edf5;border-radius:16px;box-shadow:none}
      .mobile-search{height:44px;width:100%;border:1px solid #e2e6ed;border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
      .mobile-list{display:grid;gap:8px;margin-top:10px}
      .customer-card{padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
      .customer-main{min-width:0;flex:1}
      .customer-name{font-weight:700;font-size:15px;color:#1f2d3d}
      .customer-line{margin-top:4px;font-size:12px;color:#6b7a90}
      .customer-actions{display:flex;gap:6px}
      .customer-action-btn{height:32px;padding:0 10px;border-radius:10px;border:1px solid #dbe2ed;background:#fff;font-size:12px}
      .customer-action-btn.delete{border-color:#ffd6d6;background:#fff5f5;color:#d4380d}
      aside{display:none!important}
      main{padding:10px}
      .top{margin-bottom:10px;gap:8px;align-items:flex-start}
      .top h1{font-size:22px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
      .top .row{min-width:0;display:flex;align-items:center;justify-content:flex-end}
      #u{display:inline-block;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

      /* mobile-order（新建订单） */
      .mobile-order-section-title{font-weight:700;font-size:15px;margin:2px 0 6px}
      .mobile-order-form{display:grid;gap:10px}
      .mobile-order-card{padding:12px}
      .mobile-order-label{font-size:12px;color:#6b7a90;margin:2px 0 6px}
      .mobile-order-input{height:44px;border:1px solid #e2e6ed;border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
      .mobile-order-money{font-weight:800;color:#d4380d}
      .mobile-order-subtotal{font-weight:700;color:#1677ff}
      .mobile-order-dash-btn{height:44px;border:2px dashed #cfd6e3;border-radius:14px;background:#fff;color:#1677ff;font-weight:700}
      .mobile-order-danger-btn{height:36px;min-height:36px;width:auto;padding:0 10px;border-radius:10px;border:1px solid #ffd6d6;background:#fff5f5;color:#d4380d}
      .mobile-order-submit-btn{height:48px;border:none;border-radius:14px;background:#1677ff;color:#fff;font-weight:800;font-size:16px}
      .mobile-order-items{display:grid;gap:10px}
      .mobile-order-item{background:#fff;border-radius:16px;padding:12px;border:1px solid #eff0f4}
      .mobile-order-item-grid{display:flex;flex-direction:column;gap:10px}
      .mobile-order-two-cols{display:flex;gap:10px}
      .mobile-order-two-cols > .mobile-order-field{flex:1}
      .mobile-order-field{display:flex;flex-direction:column;gap:6px}
      .mobile-order-field label{font-size:12px;color:#6b7a90}
      .mobile-order-field input{height:44px;border:1px solid #e2e6ed;border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
      .mobile-order-item-footer{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
      .mobile-order-item-footer .mobile-order-subtotal{font-size:14px}

      /* mobile-ship（发货看板） */
      .mobile-ship-card{background:#fff;border-radius:16px;border:1px solid #eff0f4;overflow:hidden}
      .mobile-ship-header{width:100%;border:none;background:#fff;padding:12px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
      .mobile-ship-detail{padding:12px 12px 14px;background:#fff}
      .mobile-ship-detail-inner{display:flex;flex-direction:column;gap:10px}
      .mobile-ship-products{display:flex;flex-direction:column;gap:8px}
      .mobile-ship-item{border:1px solid #eef2f7;border-radius:14px;padding:10px;background:#fff}
      .mobile-ship-item-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
      .mobile-ship-item-title strong{font-size:14px}
      .mobile-ship-item-meta{font-size:12px;color:#6b7a90;margin-top:4px}
      .mobile-ship-input{height:44px;border:1px solid #e2e6ed;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;width:100%;box-sizing:border-box}
      .mobile-ship-info-row{display:flex;gap:10px}
      .mobile-ship-info-row > *{flex:1}
      input[type="date"].mobile-ship-input{width:100%;box-sizing:border-box}
    }
    /* —— 库存管理（桌面铺满） */
    #inventoryView:not(.hidden){width:calc(100% + 40px);padding:16px;box-sizing:border-box;margin:0 -20px}
    .inv-page{width:100%;max-width:none}
    .inv-toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px}
    .inv-toolbar .btn-p.inv-toolbar-btn{font-size:14px;border-radius:8px;padding:8px 16px;min-height:auto;width:auto;font-weight:600}
    .inv-overview{display:flex;flex-wrap:nowrap;gap:0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow-x:auto;box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .inv-overview-item{flex:1;min-width:120px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 14px;border-right:1px solid var(--line)}
    .inv-overview-item:last-child{border-right:none}
    .inv-overview-item .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
    .inv-overview-item .v{font-size:14px;font-weight:700;white-space:nowrap}
    .inv-overview-item.warn .v{color:#b45309}
    .inv-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;margin-top:10px;box-shadow:0 1px 0 rgba(0,0,0,.04);min-height:min(70vh,620px);display:flex;flex-direction:column}
    .inv-card-hd{padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbff}
    .inv-card-hd h2{margin:0;font-size:15px}
    .inv-card-bd{flex:1;min-height:0;overflow:auto}
    .inv-table{width:100%;border-collapse:collapse;min-width:860px;font-size:13px}
    .inv-table thead th,.inv-table tbody td{text-align:center;vertical-align:middle}
    .inv-table thead th{position:sticky;top:0;background:#f8faff;z-index:1;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);padding:10px 8px}
    .inv-data-row{cursor:pointer}
    .inv-data-row:hover td{background:#f8fbff}
    .inv-thumb-wrap{width:48px}
    .inv-thumb-img,.inv-thumb-ph{width:40px;height:40px;border-radius:8px;object-fit:cover;display:block}
    .inv-thumb-ph{background:linear-gradient(135deg,#e8ecf4,#dfe5ef);border:1px solid #dbe2ed}
    .inv-stock-num{font-weight:700}
    .inv-badge{display:inline-flex;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;border:1px solid transparent}
    .inv-st-out{background:#fff1f2;color:#be123c;border-color:#fecdd3}
    .inv-st-soon{background:#fffbeb;color:#b45309;border-color:#fde68a}
    .inv-st-ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
    .inv-qty-in{color:#166534;font-weight:700}
    .inv-qty-out{color:#be123c;font-weight:700}
    .inv-flow-tr td{border-bottom:1px solid var(--line);padding:0!important;background:transparent!important;vertical-align:top}

    const ord = id => st.orders.find(o=>o.id===id);
    const items = id => (ord(id)?.order_items)||[];
    const ships = id => ([...(ord(id)?.shipments||[])].sort((a,b)=>a.shipped_at<b.shipped_at?1:-1));
    const productKey = v => String(v||"").trim();
    const shippedMap = id => {
      const m = {};
      ships(id).forEach(s => (s.items||[]).forEach(i => {
        const k = productKey(i.product_name);
        if(!k) return;
        m[k] = n(m[k]) + n(i.quantity_shipped);
      }));
      return m;
    };
    const progress = o => {
      const map = shippedMap(o.id);
      const t = (o.order_items||[]).reduce((s,i)=>s+n(i.quantity),0);
      const sh = (o.order_items||[]).reduce((s,i)=>s+Math.min(n(i.quantity),n(map[productKey(i.product_name)])),0);
      const p = t>0?Math.max(0,Math.min(100,Math.round(sh/t*100))):0;
      return {t,sh,p};
    };
    const itemProgress = (o, item) => {
      const map = shippedMap(o.id);
      const q = n(item?.quantity);
      const sh = Math.min(q, n(map[productKey(item?.product_name)]));
      const p = q > 0 ? Math.max(0, Math.min(100, Math.round(sh / q * 100))) : 0;
      return { q, sh, rm: Math.max(0, q - sh), p };
    };

    /**
     * 产品型号/名称以「录入」为准：优先对接 Api.getProductByCode；再按本地 sku/名称精确匹配；
     * 若仍无匹配则本地新增一条产品（非「查找失败」拦截）。
     */
    async function invPrepareInboundProduct(typedText,categoryForNewRow){
      const c=String(typedText||"").trim();
      if(!c)return null;
      try{
        const r=await Api.getProductByCode(c);
        if(r&&!r.error&&r.data){
          const loc=st.inv.products.find(x=>String(x.sku).trim()===String(r.data.sku).trim());
          if(loc)return loc;
          if(!st.inv.products.some(x=>x.id===r.data.id))st.inv.products.push(r.data);
          return st.inv.products.find(x=>x.id===r.data.id)||r.data;
        }
      }catch(e){console.warn("[库存] getProductByCode",e);}
      let hit=st.inv.products.find(x=>String(x.sku).trim()===c);
      if(hit)return hit;
      hit=st.inv.products.find(x=>String(x.name).trim()===c);
      if(hit)return hit;
      const low=c.toLowerCase();
      const cand=st.inv.products.filter(x=>String(x.name).toLowerCase()===low||String(x.sku).toLowerCase()===low);
      if(cand.length===1)return cand[0];
      const p=invCreateAdhocProduct(c,categoryForNewRow);
      st.inv.products.push(p);
      return p;
    }

    function invCreateInboundAdhoc(name,sku,category,unit){
      const id="p-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const cat=String(category||"成品").trim()||"成品";

    async function invResolveInboundProduct(name,sku,categoryLabel,unit){
      const nm=String(name||"").trim(),sk=String(sku||"").trim();
      const u=(String(unit||"").trim())||"件";
      const cat=(String(categoryLabel||"成品").trim())||"成品";
      if(!nm||!sk)return null;
      try{
        const r=await Api.getProductByCode(sk);
        if(r&&!r.error&&r.data){
          const loc=st.inv.products.find(x=>String(x.sku).trim()===String(r.data.sku).trim());
          if(loc){loc.name=nm;loc.unit=u;loc.category=cat;return loc;}
          if(!st.inv.products.some(x=>x.id===r.data.id))st.inv.products.push(r.data);
          const pl=st.inv.products.find(x=>x.id===r.data.id)||r.data;
          pl.name=nm;pl.sku=sk;pl.unit=u;pl.category=cat;
          return pl;
        }
      }catch(e){console.warn("[库存] getProductByCode",e);}
      let hit=st.inv.products.find(x=>String(x.sku).trim()===sk);
      if(hit){hit.name=nm;hit.unit=u;hit.category=cat;return hit;}
      hit=st.inv.products.find(x=>String(x.name).trim()===nm);
      if(hit){hit.sku=sk;hit.unit=u;hit.category=cat;return hit;}
      const low=nm.toLowerCase();
      const cand=st.inv.products.filter(x=>String(x.name).toLowerCase()===low);
      if(cand.length===1){const h=cand[0];h.sku=sk;h.unit=u;h.category=cat;return h;}
      const p=invCreateInboundAdhoc(nm,sk,cat,u);
      st.inv.products.push(p);
      return p;
    }

              const dbPid=Api.getInventoryProductCloudId(p);
              if(dbPid)await Api.adjustStock(dbPid,dir==="in"?"in":"out",qty,remark);
              else console.warn("[库存调整] 无云端产品 UUID，已跳过 Supabase（仅本地）");
              p.current_stock=next;
              const lt=dir==="in"?"入库调整":"出库调整";
              st.inv.ledger.unshift({id:invNewLid(),product_id:pid,time:invNowTime(),type:lt,quantity_delta:delta,remark:remark||"—"});
              invPersist();
              invCloseModal("invModalModifyStock");
              await invAfterMutationRefresh();
            }catch(err){alert(Api.formatSupabaseError(err));}
          })();
          return;
        }
        if(e.target.id==="invDetailEditBtn"){e.stopPropagation();invEnsure();invDetailEnterEdit();return;}
        if(e.target.id==="invDetailEditCancel"){e.stopPropagation();invEnsure();invDetailCancelEdit();return;}
        if(e.target.id==="invDetailSave"){e.stopPropagation();invEnsure();(async()=>{await invDetailSaveFromForm();})();return;}
        if(e.target.id==="invWarnSave"){
          invEnsure();
          const pid=$("invWarnPid")?.value,w=Math.floor(n($("invWarnLevel")?.value));
          if(!pid||!Number.isFinite(w)||w<0){alert("请填写有效的预警值（≥0）");return;}
          const p=st.inv.products.find(x=>x.id===pid);
          if(!p)return;
          (async()=>{
            try{
              console.log("[库存] 模拟仅更新预警值", {productId:pid,warnStock:w});
              const dbPid=Api.getInventoryProductCloudId(p);
              if(dbPid)await Api.updateProductWarning(dbPid,w);
              else console.warn("[库存] 无云端产品 UUID，已跳过 Supabase（仅本地）");
              p.warning_level=w;
              invPersist();
              invCloseModal("invModalWarn");
              await invAfterMutationRefresh();
            }catch(err){alert(Api.formatSupabaseError(err));}
          })();
          return;
        }
        if(e.target.id==="invLedgerFullPrev"){
          invEnsure();
          if(st.inv.ledgerFullPage>0){st.inv.ledgerFullPage--;invRenderLedgerFullBody();}
          return;
        }
        if(e.target.id==="invLedgerFullNext"){
          invEnsure();
          st.inv.ledgerFullPage++;
          invRenderLedgerFullBody();
          return;
        }
        const invDel=e.target.closest("[data-inv-del]");
        if(invDel){
          invEnsure();
          const id=invDel.getAttribute("data-inv-del");
          const p=st.inv.products.find(x=>x.id===id);
          if(!p)return;
          if(!confirm(`确认删除产品「${p.name}」？`))return;
          if(invIsProductUsedInOrders(p)){alert("该产品已被订单引用，不可删除。");return;}
          if(invIsProductBlockedByPurchase(p)){alert("该产品已被采购单引用，不可删除。");return;}
          (async()=>{
            try{
              const dbPid=Api.getInventoryProductCloudId(p);
              if(dbPid)await Api.deleteInventoryProduct(dbPid);
              else console.warn("[库存] 删除本地演示产品，未调用云端");
              st.inv.products=st.inv.products.filter(x=>x.id!==id);
              st.inv.ledger=st.inv.ledger.filter(x=>x.product_id!==id);
              if(st.inv.expandedId===id)st.inv.expandedId=null;
              invPersist();
              await invAfterMutationRefresh();
            }catch(err){alert(Api.formatSupabaseError(err));}
          })();
          return;
        }
        const invModB=e.target.closest("[data-inv-mod-stock]");
        if(invModB){e.stopPropagation();invOpenModifyStock(invModB.getAttribute("data-inv-mod-stock"));return;}
        const invWarnB=e.target.closest("[data-inv-warn]");
        if(invWarnB){e.stopPropagation();invOpenWarn(invWarnB.getAttribute("data-inv-warn"));return;}
        const invFlowAll=e.target.closest("[data-inv-flow-all]");
        if(invFlowAll){e.stopPropagation();invOpenLedgerFull(invFlowAll.getAttribute("data-inv-flow-all"));return;}
        const invFlow=e.target.closest("[data-inv-flow]");
        if(invFlow){e.stopPropagation();invEnsure();const id=invFlow.getAttribute("data-inv-flow");if(!id)return;st.inv.expandedId=st.inv.expandedId===id?null:id;invPersist();render();return}
        const invRow=e.target.closest("[data-inv-row]");
        if(invRow){invRenderDetail(invRow.getAttribute("data-inv-row"));return}

        if(e.target.id==="newCustomerBtn"){st.editingCustomerId=null;E.customerForm.reset();openCustomerModal();return}
        if(e.target.id==="mobileLogoutBtn"){const {error}=await Api.logout();if(error)alert(`退出失败：${error.message||"unknown"}`);return}
        if(e.target.id==="closeMobileCustomerDetail" || e.target.id==="mobileCustomerDetailModal"){document.getElementById("mobileCustomerDetailModal")?.classList.remove("show");return}

        const openCustomer=e.target.closest("[data-customer-open]");
        if(openCustomer && !e.target.closest("[data-customer-edit]") && !e.target.closest("[data-m-cdel]")){
          openMobileCustomerDetail(openCustomer.getAttribute("data-customer-open"));
          return;
        }
        const editCustomer=e.target.closest("[data-customer-edit]");
        if(editCustomer){startMobileEditCustomer(editCustomer.getAttribute("data-customer-edit"));return}
        const delCustomer=e.target.closest("[data-m-cdel]");
        if(delCustomer){
          const id=delCustomer.getAttribute("data-m-cdel"),c=st.customers.find(x=>x.id===id);
          if(!c)return;
          const cname=c.customer_name||c.name||"";
          const used=st.orders.some(o=>String(o.customer_name||"").trim()===String(cname).trim());
          if(used){mToast("该客户已被订单引用，不能删除");return}
          if(!confirm(`确认删除客户 ${cname} 吗？`))return;
          await withBtnLoading(delCustomer,"删除中...",async()=>{
            try{await Api.deleteCustomer(c.cloud_id);await refresh();mToast("客户已删除");}catch(err){alert(`删除客户失败：\n${Api.formatSupabaseError(err)}`)}
          });
          return;
        }

        if(e.target.id==="mOrderAddRow"){addMobileProductRow();return}
        const delItemBtn=e.target.closest("[data-mi-del]");
        if(delItemBtn){
          removeMobileProductRow(delItemBtn.getAttribute("data-mi-del"));
          return;
        }
        if(e.target.id==="mSubmitOrder"){
          st.createDraft.customerId=(document.getElementById("mOrderCustomer")?.value||"").trim();
          st.createDraft.contractNo=(document.getElementById("mOrderContract")?.value||"").trim();
          await submitMobileOrder(e.target);
          return;
        }

        const shipOpen=e.target.closest("[data-ship-open]");
        if(shipOpen){
          const id=shipOpen.getAttribute("data-ship-open");
          const o=ord(id);
          if(!o)return;
          if(st.shipDraft.orderId===id){st.shipDraft={orderId:"",shipped_at:"",shipment_no:"",items:[{product_name:"", quantity_shipped:""}]};renderMobile();return;}
          st.shipDraft={orderId:id,shipped_at:today(),shipment_no:"",items:(o.order_items||[]).map(it=>({product_name:it.product_name,quantity_shipped:""}))};
          renderMobile();
          return;
        }
        const shipSave=e.target.closest("[data-ship-save]");
        if(shipSave){const id=shipSave.getAttribute("data-ship-save");await saveShipFromPage(id, shipSave);return}
        const shipDel=e.target.closest("[data-ship-del]");
        if(shipDel){
          const id=shipDel.getAttribute("data-ship-del");
          const o=ord(id);
          if(!o) return;
          if(!confirm(`确认删除订单 ${o.contract_no} 吗？`)) return;
          await withBtnLoading(shipDel,"删除中...",async()=>{
            try{
              await Api.deleteOrder(o.contract_no);
              if(st.shipDraft.orderId===id) st.shipDraft={orderId:"",shipped_at:"",shipment_no:"",items:[{product_name:"", quantity_shipped:""}]};
              await refresh();
              mToast("订单已删除");
            }catch(err){
              alert(`删除订单失败：\n${Api.formatSupabaseError(err)}`);
            }
          });
          return;
        }
        const editBtn = e.target.closest('.edit-customer');
        if (editBtn) {
          const id = editBtn.getAttribute('data-id');
          const customer = st.customers.find(c => c.id === id);
          if (customer) startEditCustomer(customer);
          return;
        }
        const saveEditBtn = e.target.closest('.save-customer-edit');
        if (saveEditBtn) {
          const id = saveEditBtn.getAttribute('data-id');
          await saveEditCustomer(id);
          return;
        }
        const cancelEditBtn = e.target.closest('.cancel-customer-edit');
        if (cancelEditBtn) {
          cancelEditCustomer();
          return;
        }
        if (e.target.closest('[data-field]') && st.editingCustomerId) {
          const input = e.target.closest('[data-field]');
          if (input) {
            const field = input.getAttribute('data-field');
            const value = input.value;
            if (st.customerEditFormData[field] !== undefined) st.customerEditFormData[field] = value;
          }
        }
        const orderToggle = e.target.closest("[data-order-toggle][data-order-id]");
        if(orderToggle){
          const id = orderToggle.getAttribute("data-order-id");
          st.selected = id;
          st.expandedOrders[id] = !st.expandedOrders[id];
          render();
          return;
        }

        const orderEdit = e.target.closest("[data-order-edit][data-order-id]");
        if(orderEdit){
          const id = orderEdit.getAttribute("data-order-id");
          const o = ord(id);
          if(o) openOrderModal(o);
          return;
        }

        const orderDel = e.target.closest("[data-order-delete][data-order-id]");
        if(orderDel){
          const id = orderDel.getAttribute("data-order-id");
          const o = ord(id);
          if(!o) return;
          if(!confirm(`确认删除订单 ${o.contract_no} 吗？`)) return;
          await withBtnLoading(orderDel,"删除中...",async()=>{
            try{
              await Api.deleteOrder(o.contract_no);
              delete st.expandedOrders[id];
              if(st.selected===id) st.selected="";
              await refresh();
            }catch(err){
              alert(`删除订单失败：\n${Api.formatSupabaseError(err)}`);
            }
          });
          return;
        }

        const shipSubmit = e.target.closest("[data-ship-submit][data-order-id]");
        if(shipSubmit){
          const id = shipSubmit.getAttribute("data-order-id");
          const o = ord(id);
          if(!o) return;
          const shipNo = (document.querySelector(`[data-ship-no][data-order-id="${CSS.escape(id)}"]`)?.value || "").trim();
          const shipDate = (document.querySelector(`[data-ship-date][data-order-id="${CSS.escape(id)}"]`)?.value || "").trim();
          if(!shipNo){ alert("请填写发货单号。"); return; }
          if(!shipDate){ alert("请选择发货日期。"); return; }

          const map = shippedMap(o.id);
          const shipItems = (o.order_items||[]).map((it,idx)=>{
            const v = document.querySelector(`[data-ship-qty][data-order-id="${CSS.escape(id)}"][data-idx="${idx}"]`)?.value;
            return { product_name: productKey(it.product_name), quantity_shipped: n(v) };
          }).filter(x=>x.quantity_shipped>0);

          if(!shipItems.length){ alert("请至少填写一项发货数量。"); return; }
          const orderItemByKey = {};
          (o.order_items||[]).forEach(x=>{
            const k = productKey(x.product_name);
            if(k) orderItemByKey[k] = x;
          });
          for(const item of shipItems){
            const k = productKey(item.product_name);
            const oi = orderItemByKey[k];
            const remain = Math.max(0,n(oi?.quantity)-Math.min(n(oi?.quantity),n(map[k])));
            if(item.quantity_shipped>remain){
              alert(`${item.product_name} 超出剩余数量（最多 ${fmtQ(remain)}）。`);
              return;
            }
          }

          const ship = { shipment_id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), shipment_no:shipNo, shipped_at:shipDate, items:shipItems };
          await withBtnLoading(shipSubmit,"提交中...",async()=>{
            try{
              await Api.createShipment(o, ship, st.customers);
              st.selected = id;
              st.expandedOrders[id] = true;
              await refresh();
              st.expandedOrders[id] = true;
              render();
              alert("发货成功。");
            }catch(err){
              alert(`发货保存失败：\n${Api.formatSupabaseError(err)}`);
            }
          });
          return;
        }

        const vb=e.target.closest(".v-order"); if(vb){const id=vb.dataset.id;st.selected=id;st.expandedOrders[id]=!st.expandedOrders[id];render();return}
        if(e.target.id==="newOrderBtn"){openOrderModal(null);return}
        if(e.target.id==="newCustomerBtn"){openCustomerModal();return}
        if(e.target.id==="backBtn"){st.appState={tab:"orders",page:"orders/list",params:{}};render();return}
        if(e.target.id==="editOrderBtn"){const o=ord(st.selected);if(o)openOrderModal(o);return}
        if(e.target.id==="newShipBtn"){if(!st.selected)return;openShipModal(st.selected);return}
        if(e.target.id==="delOrderBtn"){const o=ord(st.selected);if(!o)return;if(!confirm(`确认删除订单 ${o.contract_no} 吗？`))return;try{await Api.deleteOrder(o.contract_no);st.selected="";st.appState={tab:"orders",page:"orders/list",params:{}};await refresh()}catch(err){alert(`删除订单失败：\n${Api.formatSupabaseError(err)}`)}return}
        const actionBtn=e.target.closest("[data-action][data-order-id]");
        if(actionBtn){
          const action=actionBtn.getAttribute("data-action"),id=actionBtn.getAttribute("data-order-id"),o=ord(id);
          if(!o)return;
          st.selected=id;
          if(action==="edit"){openOrderModal(o);return}
          if(action==="ship"){openShipModal(id);return}
          if(action==="delete"){
            if(!confirm(`确认删除订单 ${o.contract_no} 吗？`))return;
            try{await Api.deleteOrder(o.contract_no);delete st.expandedOrders[id];if(st.selected===id)st.selected="";st.appState={tab:"orders",page:"orders/list",params:{}};await refresh()}catch(err){alert(`删除订单失败：\n${Api.formatSupabaseError(err)}`)}
            return;
          }
        }
        const dc=e.target.closest(".del-c"); if(dc){const id=dc.dataset.id,c=st.customers.find(x=>x.id===id);if(!c)return;const cname=c.customer_name||c.name||"";const used=st.orders.some(o=>String(o.customer_name||"").trim()===String(cname).trim());if(used){alert("该客户已被订单引用，不能删除。");return}if(!confirm(`确认删除客户 ${cname} 吗？`))return;try{await Api.deleteCustomer(c.cloud_id);await refresh()}catch(err){alert(`删除客户失败：\n${Api.formatSupabaseError(err)}`)}return}
        if(e.target.id==="expBtn")exportX();
        if(e.target.id==="stmtGenBtn"){render();return}
      });
      document.body.addEventListener("input",e=>{
        if(e.target.id==="mCustomerSearch"){st.customerQuery=e.target.value||"";if(isMobile()&&st.appState.tab==="customers")renderMobile();return}
        if(isMobile() && st.appState.tab==="orders"){
          const nameIdx=e.target?.getAttribute?.("data-mi-name");
          const specIdx=e.target?.getAttribute?.("data-mi-spec");
          const qtyIdx=e.target?.getAttribute?.("data-mi-qty");
          const priceIdx=e.target?.getAttribute?.("data-mi-price");
          if(nameIdx!==null && nameIdx!==undefined){
            st.createDraft.items[n(nameIdx)]={...st.createDraft.items[n(nameIdx)],product_name:e.target.value};
            updateMobileOrderTotal();
            return;
          }
          if(specIdx!==null && specIdx!==undefined){
            st.createDraft.items[n(specIdx)]={...st.createDraft.items[n(specIdx)],product_spec:e.target.value};
            updateMobileOrderTotal();
            return;
          }
          if(qtyIdx!==null && qtyIdx!==undefined){
            st.createDraft.items[n(qtyIdx)]={...st.createDraft.items[n(qtyIdx)],quantity:e.target.value};
            updateMobileOrderTotal();
            return;
          }
          if(priceIdx!==null && priceIdx!==undefined){
            st.createDraft.items[n(priceIdx)]={...st.createDraft.items[n(priceIdx)],unit_price:e.target.value};
            updateMobileOrderTotal();
            return;
          }
        }
        const input=e.target.closest("[data-field]");
        if(!input||!st.editingCustomerId)return;
        const field=input.getAttribute("data-field");
        if(field && st.customerEditFormData[field]!==undefined)st.customerEditFormData[field]=input.value;
      });
      document.body.addEventListener("change",e=>{
        if(e.target.id==="invInBizType"){invToggleInboundTypeOther();return}
        if(e.target.id==="invInImage"){
          const f=e.target.files&&e.target.files[0];
          if(!f){st.inv._inboundImage=null;return;}
          const r=new FileReader();
          r.onload=()=>{
            st.inv._inboundImage={name:f.name,type:f.type,size:f.size,dataUrl:r.result};
            console.log("[入库] 已选择图片文件（弹窗不预览）", f.name);
          };
          r.readAsDataURL(f);
          return;
        }
        if(e.target.id==="invDetImage"){
          const f=e.target.files&&e.target.files[0];
          if(!f){st.inv._detailNewImageDataUrl=null;return;}
          const r=new FileReader();
          r.onload=()=>{
            st.inv._detailNewImageDataUrl=r.result;
            const prev=$("invDetImgPreview");
            if(prev){prev.src=r.result;}
            else{
              const slot=$("invDetImgSlot");
              if(slot)slot.innerHTML=`<img class="inv-detail-img" src="${r.result}" alt="" id="invDetImgPreview">`;
            }
            console.log("[产品详情] 编辑模式已选新图（模拟）", f.name);
          };
          r.readAsDataURL(f);
          return;
        }
        if(e.target.id==="stmtCustomer"){
          st.statementCustomerId = e.target.value || "";
          render();
          return;
        }
        if(e.target.id==="monthInput"){st.statementMonth=e.target.value||month();render();return}
        const nameIdx=e.target.getAttribute("data-mi-name"),specIdx=e.target.getAttribute("data-mi-spec"),qtyIdx=e.target.getAttribute("data-mi-qty"),priceIdx=e.target.getAttribute("data-mi-price"),shipIdx=e.target.getAttribute("data-si-qty");
        if(nameIdx!==null){st.createDraft.items[n(nameIdx)]={...st.createDraft.items[n(nameIdx)],product_name:e.target.value};updateMobileOrderTotal();return}
        if(specIdx!==null){st.createDraft.items[n(specIdx)]={...st.createDraft.items[n(specIdx)],product_spec:e.target.value};updateMobileOrderTotal();return}
        if(qtyIdx!==null){st.createDraft.items[n(qtyIdx)]={...st.createDraft.items[n(qtyIdx)],quantity:e.target.value};updateMobileOrderTotal();return}
        if(priceIdx!==null){st.createDraft.items[n(priceIdx)]={...st.createDraft.items[n(priceIdx)],unit_price:e.target.value};updateMobileOrderTotal();return}
        if(shipIdx!==null){st.shipDraft.items[n(shipIdx)]={...st.shipDraft.items[n(shipIdx)],quantity_shipped:e.target.value};return}
      });
      window.addEventListener("resize",()=>render());
    }
    async function initForSession(sess){toggleAuth(sess);if(!sess)return;try{await Api.checkConnection()}catch(err){alert(`Supabase 连接失败：\n${Api.formatSupabaseError(err)}`)}await refresh()}
    async function init(){
      bind();
      st.statementMonth=month();
      authSetMode("login");
      const hadAuthHash=!!(window.location.hash&&window.location.hash.length>1&&(window.location.hash.includes("access_token")||window.location.hash.includes("type=")));
      const sess=await Api.getSession();
      consumeAuthRedirectNotice(sess,hadAuthHash);
      await initForSession(sess);
      Api.onAuthStateChange(async s=>{toggleAuth(s);if(s)await refresh()});
      Api.subscribeCloudChanges(async()=>{if(E.app.classList.contains("hidden"))return;await refresh()});
    }
    init();
  </script>
</body>
</html>
