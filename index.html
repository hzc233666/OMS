<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>ERP 系统</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--line:#e8eaef;--text:#0f172a;--muted:#64748b;
      --p:#2563eb;--p2:#eff6ff;--d:#dc2626;--d2:#fef2f2;--s:#f1f5f9;
      --warn:#ea580c;--ok:#16a34a;
      --radius-card:16px;--shadow-card:0 1px 3px rgba(15,23,42,.06);--shadow-hover:0 8px 24px rgba(15,23,42,.08);
      --ease:all .2s ease;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
    .hidden{display:none!important}
    .field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
    input,select,button{width:100%;min-height:36px;border:1px solid #cfd6e3;border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
    button{cursor:pointer;font-weight:600}
    .row{display:flex;gap:8px}.btn-p{background:var(--p);border-color:var(--p);color:#fff}.btn-s{background:var(--s)}.btn-d{background:var(--d2);border-color:#ffccc7;color:var(--d)}
    .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,40px);background:linear-gradient(165deg,#f8fafc 0%,#f1f5f9 40%,#eef2ff 100%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
    .auth-card-v2{width:100%;max-width:400px;background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:clamp(24px,5vw,36px);box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .auth-brand{font-size:1.35rem;font-weight:650;letter-spacing:-.02em;color:#0f172a;margin:0 0 6px}
    .auth-sub{font-size:13px;color:#64748b;margin:0 0 22px;line-height:1.45}
    .auth-tabs{display:flex;gap:4px;padding:4px;background:#f1f5f9;border-radius:12px;margin-bottom:22px}
    .auth-tab{flex:1;border:none;background:transparent;color:#64748b;font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s ease,color .15s ease}
    .auth-tab:hover{color:#334155}
    .auth-tab.active{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(15,23,42,.07)}
    .auth-field{margin-bottom:16px}
    .auth-field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px}
    .auth-input{width:100%;min-height:44px;border:1px solid #e2e8f0;border-radius:10px;padding:0 14px;font-size:15px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease;box-sizing:border-box}
    .auth-input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
    .auth-pass-wrap{position:relative}
    .auth-pass-wrap .auth-input{padding-right:92px}
    .auth-toggle-pwd{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#f8fafc;color:#475569;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background .15s ease,color .15s ease;width:auto;min-height:auto}
    .auth-toggle-pwd:hover{background:#e2e8f0;color:#0f172a}
    .auth-primary{width:100%;min-height:46px;border:none;border-radius:12px;background:#4f46e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .15s ease,opacity .15s ease,transform .06s ease;box-sizing:border-box}
    .auth-primary:hover:not(:disabled){background:#4338ca}
    .auth-primary:active:not(:disabled){transform:scale(.995)}
    .auth-primary:disabled{opacity:.55;cursor:not-allowed}
    .auth-banner{margin-top:14px;padding:12px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;font-size:13px;color:#166534;line-height:1.55;display:none}
    .auth-banner.show{display:block}
    .auth-banner strong{color:#14532d;font-weight:650}
    .auth-footer{margin-top:18px;text-align:center;font-size:13px;color:#64748b;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
    .auth-link{background:none;border:none;padding:0;color:#4f46e5;font-weight:600;cursor:pointer;font-size:inherit;text-decoration:underline;text-underline-offset:3px;width:auto;min-height:auto}
    .auth-link:hover{color:#4338ca}
    .auth-link:disabled{opacity:.45;cursor:not-allowed;text-decoration:none;color:#94a3b8}
    .auth-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120%);max-width:min(400px,calc(100vw - 32px));padding:12px 18px;background:#0f172a;color:#f8fafc;font-size:14px;font-weight:500;border-radius:12px;box-shadow:0 10px 40px rgba(15,23,42,.2);z-index:10000;opacity:0;transition:opacity .22s ease,transform .22s ease;pointer-events:none;line-height:1.45}
    .auth-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .auth-toast.err{background:#991b1b;color:#fef2f2}
    .layout{min-height:100vh;display:grid;grid-template-columns:var(--erp-sider,252px) 1fr;transition:grid-template-columns .22s ease}
    .layout-erp{--erp-sider:252px}
    .layout-erp.sidebar-collapsed{--erp-sider:64px}
    aside,.erp-aside{
      background:linear-gradient(165deg,#0f172a 0%,#1e293b 48%,#0f172a 100%);
      color:#e2e8f0;padding:16px 12px;display:flex;flex-direction:column;min-height:100vh;overflow:hidden;
      border-right:1px solid rgba(255,255,255,.06);transition:width .22s ease,padding .22s ease;
    }
    .erp-aside-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;padding:0 6px}
    .brand{font-weight:700;color:#fff;margin:0;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .erp-sidebar-toggle{
      border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#e2e8f0;border-radius:10px;width:36px;height:36px;padding:0;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;transition:var(--ease);flex-shrink:0;
    }
    .erp-sidebar-toggle:hover{background:rgba(255,255,255,.12);color:#fff}
    .erp-sidebar-toggle svg{width:18px;height:18px;stroke-width:2}
    .erp-sidebar-toggle .erp-i-collapse{display:none}
    .layout-erp.sidebar-collapsed .erp-sidebar-toggle .erp-i-expand{display:none}
    .layout-erp.sidebar-collapsed .erp-sidebar-toggle .erp-i-collapse{display:block}
    .erp-sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
    .nav-lucide{width:20px;height:20px;flex-shrink:0;opacity:.88}
    .nav-link,.nav-group-head{width:100%;text-align:left;background:transparent;color:#cbd5e1;border:none;border-radius:10px;min-height:40px;padding:10px 12px;margin:0;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;transition:var(--ease);position:relative}
    .nav-link:hover,.nav-group-head:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav-link.active,.nav-link-root.active{
      background:rgba(37,99,235,.22);color:#fff;
      box-shadow:inset 3px 0 0 #3b82f6;
    }
    .nav-link.active .nav-lucide,.nav-link-root.active .nav-lucide{opacity:1;color:#93c5fd}
    .nav-group-head{justify-content:space-between}
    .nav-group-head .nav-group-title{flex:1;text-align:left;font-weight:600}
    .nav-chevron{width:14px;height:14px;opacity:.55;transition:transform .2s ease}
    .nav-group.open .nav-chevron{transform:rotate(-180deg)}
    .nav-children{display:none;padding:4px 0 8px 8px;margin:0 0 4px 14px;border-left:1px solid rgba(255,255,255,.12)}
    .nav-group.open .nav-children{display:flex;flex-direction:column;gap:2px}
    .nav-children .nav-link{padding-left:10px;font-weight:500;font-size:12px;min-height:36px}
    .layout-erp.sidebar-collapsed .nav-label,.layout-erp.sidebar-collapsed .nav-group-title,.layout-erp.sidebar-collapsed .nav-chevron{display:none!important}
    .layout-erp.sidebar-collapsed .nav-children{display:none!important}
    .layout-erp.sidebar-collapsed .brand{font-size:0}
    .layout-erp.sidebar-collapsed .brand::after{content:"ERP";font-size:11px;font-weight:800;letter-spacing:.06em}
    .layout-erp.sidebar-collapsed .nav-link,.layout-erp.sidebar-collapsed .nav-group-head{justify-content:center;padding:10px}
    .erp-main{display:flex;flex-direction:column;min-width:0;min-height:100vh;background:var(--bg)}
    .erp-header{
      height:64px;min-height:64px;border-bottom:1px solid var(--line);background:#fff;
      display:flex;align-items:center;box-shadow:none;
    }
    .erp-header-inner{max-width:none;margin:0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px}
    .erp-header-title{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
    .erp-header-spacer{flex:1;min-width:0}
    .erp-header-actions{display:flex;align-items:center;gap:8px}
    .erp-icon-btn{
      width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);
      display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--ease);
    }
    .erp-icon-btn:hover{background:var(--s);color:var(--text);border-color:#e2e8f0}
    .erp-icon-btn svg{width:20px;height:20px}
    .erp-user-menu-wrap{position:relative}
    .erp-user-trigger{
      display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;
      transition:var(--ease);width:auto;min-height:auto;font:inherit;
    }
    .erp-user-trigger:hover{background:var(--s);border-color:var(--line)}
    .erp-avatar{
      width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:13px;font-weight:700;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .erp-user-name{max-width:160px;font-size:14px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .erp-user-trigger .erp-chevron{width:16px;height:16px;color:var(--muted)}
    .erp-user-dropdown{
      position:absolute;right:0;top:calc(100% + 8px);min-width:180px;background:#fff;border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow-hover);padding:6px;z-index:200;
    }
    .erp-dropdown-item{
      width:100%;text-align:left;padding:10px 14px;border:none;background:transparent;border-radius:8px;font-size:14px;cursor:pointer;color:var(--text);transition:var(--ease);
    }
    .erp-dropdown-item:hover{background:var(--s)}
    .erp-content{padding:16px 20px;flex:1;min-width:0;margin:0;width:100%;max-width:none}
    /** 去套娃：页面不放外层 card，仅工具栏 + 功能模块 */
    .erp-page{width:100%;max-width:100%}
    .erp-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap;min-height:40px}
    /** 工作台顶栏：左筛选 / 右主操作，与表格一体 */
    .erp-workbench-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;min-width:0}
    .erp-workbench-toolbar__main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
    .erp-workbench-toolbar__actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
    .erp-ctl-inline{display:inline-flex;align-items:center;gap:6px;margin:0}
    .erp-ctl-inline .erp-ctl-lbl{font-size:12px;color:var(--muted);white-space:nowrap;margin:0}
    .erp-ctl{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);box-sizing:border-box;font-family:inherit;font-weight:500;width:auto}
    /** .erp-ctl 在全局 .btn-p 之后，会盖住主色；主操作按钮需显式恢复蓝底白字 */
    .erp-ctl.btn-p{background:var(--p);border-color:var(--p);color:#fff}
    .erp-ctl.btn-p:hover{filter:brightness(1.06)}
    button.erp-ctl{font-weight:600;cursor:pointer}
    input.erp-ctl[type=search],input.erp-ctl[type=text],input.erp-ctl[type=month],input.erp-ctl[type=date]{width:auto}
    .erp-ctl--grow{flex:1;min-width:200px;max-width:560px}
    .erp-ctl--select{min-width:120px}
    .erp-ctl--month{min-width:150px}
    .erp-module--table{margin-top:0}
    .erp-toolbar--end{justify-content:flex-end}
    .erp-toolbar--wrap{align-items:flex-end}
    .erp-module{background:#fff;border:1px solid #eceef2;border-radius:var(--radius-card);box-shadow:var(--shadow-card);overflow:hidden}
    .erp-module--table{padding:0}
    .erp-module--table .wrap{padding:0}
    .erp-module--pad{padding:18px 20px}
    .erp-stat-summary{margin-top:14px}
    .menu{width:100%;text-align:left;background:transparent;color:#d7e0ee;border:1px solid transparent;border-radius:8px;min-height:40px;padding:0 10px;margin-bottom:8px}
    .menu.active{background:#1e293b;border-color:#334155;color:#fff}
    main{padding:18px 20px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .top h1{margin:0;font-size:22px;font-weight:700}.muted{color:var(--muted)}
    .card{background:var(--card);border:1px solid #eceef2;border-radius:var(--radius-card);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-card);transition:var(--ease)}
    .card:hover{box-shadow:var(--shadow-hover)}
    /* Dashboard */
    .dash-page{width:100%;max-width:100%;overflow-x:hidden}
    .dash-layout{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin:0}
    .dash-kpi-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0}
    @media(max-width:1100px){.dash-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:640px){.dash-kpi-grid{grid-template-columns:1fr}}
    .dash-kpi-card{
      background:#fff;border:1px solid #eceef2;border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-card);
      transition:border-color .2s ease,box-shadow .2s ease;display:flex;gap:12px;align-items:flex-start;min-width:0;max-width:100%;
    }
    .dash-kpi-card:hover{border-color:#dbe3ef;box-shadow:0 2px 8px rgba(15,23,42,.06)}
    .dash-kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .dash-kpi-icon svg{width:22px;height:22px;color:#fff}
    .dash-kpi-body{min-width:0;flex:1}
    .dash-kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
    .dash-kpi-value{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--text);line-height:1.15;margin:0 0 2px;font-variant-numeric:tabular-nums}
    .dash-kpi-meta{font-size:12px;color:var(--muted);margin:0;line-height:1.4}
    .dash-kpi-trend{font-size:11px;font-weight:600;margin-top:4px}
    .dash-kpi-trend.up{color:var(--ok)}.dash-kpi-trend.down{color:var(--d)}.dash-kpi-trend.neutral{color:var(--muted)}
    .dash-split{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0}
    @media(max-width:900px){.dash-split{grid-template-columns:1fr}}
    .dash-panel{background:#fff;border:1px solid #eceef2;border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-card);min-width:0;max-width:100%}
    .dash-panel-h{font-size:14px;font-weight:700;margin:0 0 12px;color:var(--text)}
    .dash-table-wrap{overflow-x:hidden;margin:0;max-width:100%}
    .dash-table{width:100%;min-width:0;border-collapse:collapse;font-size:13px;table-layout:fixed}
    .dash-table th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px}
    .dash-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;transition:background .15s ease;white-space:normal;word-break:break-word;vertical-align:top}
    .dash-table tbody tr:hover td{background:#f8fafc}
    .dash-table .dash-col-progress{width:28%}
    .dash-table .dash-col-contract{min-width:0}
    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
    .badge-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .badge-warn{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
    .badge-ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
    .dash-progress-track{height:6px;border-radius:999px;background:#e8ecf3;overflow:hidden;max-width:100%}
    .dash-progress-fill{height:100%;border-radius:999px;background:#2563eb;transition:width .45s ease}
    .erp-page-section{padding:0 0 8px}
    .erp-page-h1{font-size:20px;font-weight:700;margin:0 0 16px;letter-spacing:-.02em;color:var(--text)}
    .erp-page-lead{font-size:14px;line-height:1.55;margin:0 0 20px}
    .erp-page-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .erp-bom-panel{font-size:14px;color:var(--muted)}
    .hd{padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbff;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .bd{padding:14px}
    .btn-mini{width:auto;min-height:30px;padding:0 8px;font-size:12px}
    button,[type="button"],[type="submit"]{word-break:normal;overflow-wrap:normal}
    .order-items-table{table-layout:fixed;width:100%;min-width:0}
    .order-items-table th,.order-items-table td{text-align:center!important;vertical-align:middle}
    .order-items-table .col-name{width:22%}
    .order-items-table .col-spec{width:22%}
    .order-items-table .col-qty{width:14%}
    .order-items-table .col-price{width:18%}
    .order-items-table .col-total{width:14%}
    .order-items-table .col-op{width:10%}
    .order-items-table .i-total{white-space:nowrap}
    .order-items-table .i-total .ellipsis{display:inline-block;max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .order-items-table input{text-align:center}
    .wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:840px}
    th,td{border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px;white-space:nowrap;text-align:left}
    th{background:#f8faff;color:#384861}
    tr:hover td{background:#f8fbff}
    .center{text-align:center}.right{text-align:right}
    .tag{display:inline-flex;border-radius:999px;padding:2px 10px;font-size:12px}
    .t-pending{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .t-shipped{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .t-done{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    .pur-tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
    .pur-tag--draft{background:#f8fafc;color:#475569;border:1px solid #e2e8f0}
    .pur-tag--pending{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .pur-tag--approved{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .pur-tag--ordered{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}
    .pur-tag--done{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    .pur-tag--cancel{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .pur-tag--recv-p{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .pur-tag--recv-part{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
    .pur-tag--recv-done{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    .pur-tag--ap-unpaid{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .pur-tag--ap-part{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .pur-tag--ap-paid{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    #purchaseOrderModal .pur-form-section{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fafbff}
    #purchaseOrderModal .pur-form-section-h{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
    #purchaseOrderModal .pur-lines-table th{font-size:12px}
    #purchaseRecvModal .pur-diff{font-weight:700}

    .inv-detail-cards .v{font-size:18px;font-weight:800;margin-top:6px}
    .inv-mod-radio-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    #invModalModifyStock .inv-mod-dir-row label{display:flex;align-items:center;gap:8px;line-height:1;margin:0;cursor:pointer}
    #invModalModifyStock .inv-mod-dir-row input[type=radio]{accent-color:#1677ff;width:18px;height:18px;margin:0;flex-shrink:0}
    .inv-form-section{margin:0 0 16px;padding:0;border:none}
    .inv-form-section-h{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .inv-dup-hint{display:none;margin:0 0 12px;padding:10px 12px;border-radius:8px;border:1px solid #fde68a;background:#fffbeb;font-size:13px}
    .inv-dup-hint.show{display:block}
    .inv-dup-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
    .inv-dup-btns .btn-s{flex:0 0 auto}
    .inv-in-img-name{display:block;margin-top:6px;font-size:13px;word-break:break-all}
    #invModalInbound .box{width:min(640px,100%)}
    #invModalInbound .mbd{max-height:min(72vh,620px);overflow-y:auto;padding-right:4px}
    textarea.inv-warn-remark{width:100%;min-height:88px;padding:10px 12px;border:1px solid #94a3b8;border-radius:10px;box-sizing:border-box;font-size:14px;line-height:1.45;resize:vertical;background:#fff}
    textarea.inv-warn-remark:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.15)}
    #invModalModifyStock .box{width:min(560px,100%)}
    #invModalModifyStock .inv-form-section{margin-top:8px}
    #invModalLedgerFull .box{width:min(700px,calc(100vw - 48px))}
    #invModalLedgerFull .mbd{max-height:min(75vh,640px);overflow-y:auto;overflow-x:hidden;box-sizing:border-box;padding-right:4px}
    #invModalLedgerFull .inv-ledger-full-scroll{overflow-x:auto;width:100%;max-width:100%;-webkit-overflow-scrolling:touch}
    #invModalLedgerFull .inv-ledger-full-mft{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:100%;box-sizing:border-box;min-width:0}
    #invModalLedgerFull .inv-ledger-full-pager{flex:1 1 auto;min-width:0;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted);text-align:left}
    #invModalLedgerFull .inv-ledger-full-actions{display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-end;align-items:center;gap:8px;flex:0 0 auto;flex-shrink:0;min-width:0}
    #invModalLedgerFull .inv-ledger-full-actions .btn-s{flex-shrink:0;white-space:nowrap;width:auto;min-width:0}
    #invModalDetail .box{width:min(720px,100%)}
    #invModalDetail .inv-mhd{position:relative;justify-content:center;padding-right:36px;box-sizing:border-box}
    #invModalDetail .inv-mhd>strong{text-align:center;width:100%;font-weight:700}
    #invModalDetail .inv-mhd-x{position:absolute;right:0;top:50%;transform:translateY(-50%)}
    #invModalDetail .inv-detail-fields{text-align:left}
    /* 产品中心（与库存/ERP 风格一致） */
    .pc-page{width:100%;max-width:100%}
    .pc-list-toolbar .pc-search{flex:1;min-width:200px;max-width:560px;min-height:34px;border-radius:8px;border:1px solid var(--line);padding:0 10px;font-size:13px;box-sizing:border-box}
    .pc-list-toolbar .btn-p{min-height:34px;padding:0 14px;width:auto;font-size:13px;border-radius:8px}
    .orders-table-wrap .inv-table{min-width:920px}
    .orders-table-wrap .inv-table td,.orders-table-wrap .inv-table th{white-space:nowrap}
    .orders-table-wrap .inv-table .orders-col-customer,.orders-table-wrap .inv-table .orders-col-contract{white-space:normal;word-break:break-word;max-width:36ch;text-align:center;vertical-align:middle}
    .orders-table-wrap .inv-table thead th:nth-child(1),.orders-table-wrap .inv-table thead th:nth-child(2){text-align:center}
    .order-expand-cell{padding:0!important;border-bottom:1px solid var(--line)!important;background:#fafbff}
    .order-expand-inner{padding:12px 14px}
    .pc-thumb-cell{width:56px}
    .pc-thumb-img{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;border:1px solid #e2e8f0;background:#f8fafc}
    .pc-thumb-ph{border-style:dashed}
    .pc-detail-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;padding:0;border:none;background:none;color:var(--p);font-size:13px;font-weight:600;cursor:pointer;width:auto;min-height:auto;font-family:inherit}
    .pc-detail-back:hover{text-decoration:underline}
    .pc-detail-top{margin-bottom:14px}
    .pc-detail-card.erp-module--pad{padding:16px 18px}
    .pc-detail-main{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;min-width:0}
    @media(max-width:640px){.pc-detail-main{grid-template-columns:1fr}}
    .pc-detail-visual{align-self:start}
    .pc-detail-main-img,.pc-detail-img-ph{width:96px;height:96px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:#f8fafc;display:block;flex-shrink:0}
    .pc-detail-img-ph{border-style:dashed}
    .pc-detail-info{min-width:0;display:flex;flex-direction:column;gap:14px}
    .pc-detail-title-block{display:flex;flex-direction:column;gap:4px;min-width:0}
    .pc-detail-title-block .lbl{font-size:12px;color:var(--muted);font-weight:600}
    .pc-detail-title-block .tit{margin:0;font-size:17px;font-weight:700;color:var(--text);line-height:1.35;word-break:break-word}
    .pc-detail-fields-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
    @media(max-width:520px){.pc-detail-fields-grid{grid-template-columns:1fr}}
    .pc-df{display:flex;flex-direction:column;gap:3px;min-width:0}
    .pc-df .l{font-size:12px;color:var(--muted);line-height:1.35}
    .pc-df .v{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;word-break:break-word;font-variant-numeric:tabular-nums}
    .pc-detail-remark{margin:0;padding-top:12px;border-top:1px solid var(--line)}
    .pc-detail-remark .lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
    .pc-detail-remark .txt{margin:0;font-size:13px;color:var(--text);line-height:1.5;font-weight:400;word-break:break-word}
    .pc-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:0;padding:4px;background:#f1f5f9;border-radius:12px;border:1px solid #e8ecf3}
    .pc-tab{border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;width:auto;min-height:auto;transition:color .15s ease,background .15s ease}
    .pc-tab:hover{color:var(--text)}
    .pc-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.08)}
    .pc-tab-panel{padding-top:14px}
    .pc-badge-prod{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .pc-table-wrap .inv-table{min-width:720px}
    .pc-table-wrap .inv-table thead th{text-align:center}
    .pc-table-wrap .inv-table tbody td{text-align:center}
    .pc-table-wrap .inv-table tbody td.pc-td-left{text-align:left}
    .pc-table-wrap--product-list .inv-table thead th:nth-child(2),
    .pc-table-wrap--product-list .inv-table tbody td.pc-td-title{text-align:center;vertical-align:middle}
    .pc-table-wrap--product-list .inv-table tbody td.pc-td-title strong{display:inline-block;font-weight:700}
    .pc-table-wrap .inv-table tbody td.pc-td-op{white-space:normal}
    .pc-bom-page-note{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.5}
  </style>
</head>
<body>
  <div id="authToast" class="auth-toast" aria-live="polite"></div>
  <div id="auth" class="auth-shell">
    <div class="auth-card-v2">
      <h1 class="auth-brand">订单管理系统</h1>
      <p class="auth-sub">使用邮箱与密码登录；新用户注册后需在邮箱内点击确认链接。</p>
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="authTabLogin" data-auth-tab="login" role="tab" aria-selected="true">登录</button>
        <button type="button" class="auth-tab" id="authTabRegister" data-auth-tab="register" role="tab" aria-selected="false">注册</button>
      </div>
      <div class="auth-field">
        <label for="email">邮箱</label>
        <input id="email" class="auth-input" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="auth-field">
        <label for="pwd">密码</label>
        <div class="auth-pass-wrap">
          <input id="pwd" class="auth-input" type="password" autocomplete="current-password" placeholder="至少 6 位" />
          <button type="button" class="auth-toggle-pwd" id="authPwdToggle" aria-label="显示或隐藏密码">显示</button>
        </div>
      </div>
      <button type="button" class="auth-primary" id="authPrimaryBtn">登录</button>
      <div id="authRegisterBanner" class="auth-banner" role="status"></div>
      <div class="auth-footer">
        <span>邮箱未验证？</span>
        <button type="button" class="auth-link" id="authResendBtn">重新发送验证邮件</button>
      </div>
    </div>
  </div>

  <div id="app" class="layout layout-erp hidden">
    <aside class="erp-aside" id="erpAside" aria-label="主导航">
      <div class="erp-aside-head">
        <div class="brand" id="erpBrand">ERP 系统</div>
        <button type="button" class="erp-sidebar-toggle" id="erpSidebarToggle" aria-label="收起或展开侧栏" title="收起侧栏">
          <i data-lucide="chevron-left" class="erp-i-expand" aria-hidden="true"></i>
          <i data-lucide="chevron-right" class="erp-i-collapse" aria-hidden="true"></i>
        </button>
      </div>
      <nav class="erp-sidebar-nav" id="erpSidebarNav"></nav>
    </aside>
    <div class="erp-main">
      <header class="erp-header">
        <div class="erp-header-inner">
          <h1 id="title" class="erp-header-title">看板</h1>
          <div class="erp-header-spacer"></div>
          <div class="erp-header-actions">
            <span id="u" class="muted hidden" style="font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis">未登录</span>
            <button type="button" class="erp-icon-btn" id="erpNotifyBtn" aria-label="通知" title="通知">
              <i data-lucide="bell" aria-hidden="true"></i>
            </button>
            <div class="erp-user-menu-wrap">
              <button type="button" class="erp-user-trigger" id="erpUserTrigger" aria-expanded="false" aria-haspopup="true">
                <span class="erp-avatar" id="erpAvatar">—</span>
                <span class="erp-user-name" id="erpUserName">未登录</span>
                <i data-lucide="chevron-down" class="erp-chevron" aria-hidden="true"></i>
              </button>
              <div class="erp-user-dropdown hidden" id="erpUserDropdown" role="menu">
                <button type="button" class="erp-dropdown-item" id="logout">退出登录</button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="erp-content" id="erpContent">
        <div id="dashboardView"></div>
        <div id="ordersView" class="hidden"></div>
        <div id="customersView" class="hidden"></div>
        <div id="statementView" class="hidden"></div>
        <div id="inventoryView" class="hidden"></div>
        <div id="productView" class="hidden"></div>
        <div id="purchaseView" class="hidden"></div>
        <div id="analyticsView" class="hidden"></div>
        <div id="settingsView" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="orderModal" class="modal"><div class="box">
    <div class="mhd"><strong id="orderModalTitle">新建订单</strong><button id="closeOrderModal" class="btn-s btn-mini" type="button">关闭</button></div>
    <form id="orderForm">
      <div class="mbd">
        <div class="field"><label>客户</label><select id="orderCustomer"></select></div>
        <div class="field"><label>合同号</label><input id="orderNo" /></div>
        <div class="field"><label>产品明细</label><div id="itemsEditor"></div><button id="addItem" class="btn-s btn-mini" type="button" style="margin-top:8px">+ 添加产品</button></div>
      </div>
      <div class="mft"><button id="cancelOrder" class="btn-s" type="button">取消</button><button class="btn-p" type="submit">保存订单</button></div>
    </form>
  </div></div>

  <div id="customerModal" class="modal"><div class="box" style="width:min(560px,100%)">
    <div class="mhd"><strong>新建客户</strong><button id="closeCustomerModal" class="btn-s btn-mini" type="button">关闭</button></div>
    <form id="customerForm"><div class="mbd">
      <div class="field"><label>客户名称 *</label><input id="customerName" /></div>
      <div class="field"><label>客户联系人</label><input id="customerContactPerson" /></div>
      <div class="field"><label>联系电话</label><input id="customerPhone" /></div>
      <div class="field"><label>电子邮箱</label><input id="customerEmail" type="email" /></div>
      <div class="field"><label>地址信息</label><input id="customerAddress" /></div>
      <div class="field"><label>税号/统一社会信用代码</label><input id="customerTaxId" /></div>
      <div class="field"><label>备注</label><textarea id="customerRemark" rows="2" style="width:100%"></textarea></div>
    </div><div class="mft"><button id="cancelCustomer" class="btn-s" type="button">取消</button><button class="btn-p" type="submit">保存客户</button></div></form>
  </div></div>

  <div id="supplierModal" class="modal"><div class="box" style="width:min(560px,100%)">
    <div class="mhd"><strong id="supplierModalTitle">新建供应商</strong><button id="closeSupplierModal" class="btn-s btn-mini" type="button">关闭</button></div>
    <form id="supplierForm"><div class="mbd">
      <div class="field"><label>供应商名称 *</label><input id="supplierName" autocomplete="off" /></div>
      <div class="field"><label>联系人</label><input id="supplierContactPerson" autocomplete="off" /></div>
      <div class="field"><label>联系电话</label><input id="supplierPhone" autocomplete="off" /></div>
      <div class="field"><label>电子邮箱</label><input id="supplierEmail" type="email" autocomplete="off" /></div>
      <div class="field"><label>地址信息</label><input id="supplierAddress" autocomplete="off" /></div>
      <div class="field"><label>税号/统一社会信用代码</label><input id="supplierTaxId" autocomplete="off" /></div>
      <div class="field"><label>备注</label><textarea id="supplierRemark" rows="2" style="width:100%"></textarea></div>
    </div><div class="mft"><button id="cancelSupplier" class="btn-s" type="button">取消</button><button class="btn-p" type="submit">保存供应商</button></div></form>
  </div></div>

  <div id="purchaseOrderModal" class="modal"><div class="box" style="width:min(760px,100%);max-height:92vh">
    <div class="mhd"><strong id="purchaseOrderModalTitle">新建采购订单</strong><button type="button" id="closePurchaseOrderModal" class="btn-s btn-mini">关闭</button></div>
    <form id="purchaseOrderForm"><div class="mbd">
      <fieldset class="pur-form-section">
        <legend class="pur-form-section-h">基础信息</legend>
        <div class="row">
          <div class="field" style="flex:1"><label>采购单号</label><input id="purPoNo" readonly class="muted" /></div>
          <div class="field" style="flex:1"><label>创建日期</label><input id="purPoCreated" readonly /></div>
        </div>
        <div class="row">
          <div class="field" style="flex:1"><label>创建人</label><input id="purPoCreator" readonly /></div>
          <div class="field" style="flex:1"><label>供应商 *</label><select id="purPoSupplier"><option value="">请选择供应商</option></select></div>
        </div>
      </fieldset>
      <fieldset class="pur-form-section">
        <legend class="pur-form-section-h">产品明细</legend>
        <div class="wrap"><table class="pur-lines-table order-items-table"><thead><tr><th>产品名称</th><th>规格</th><th>单位</th><th>数量</th><th>单价</th><th>总价</th><th class="center">操作</th></tr></thead><tbody id="purPoLinesBody"></tbody></table></div>
        <button type="button" id="purPoAddLine" class="btn-s btn-mini" style="margin-top:8px">+ 添加一行</button>
      </fieldset>
    </div><div class="mft">
      <button type="button" id="purPoCancel" class="btn-s">取消</button>
      <button type="button" id="purPoSaveDraft" class="btn-s">保存草稿</button>
      <button type="submit" id="purPoSubmitAppr" class="btn-p">提交审批</button>
    </div></form>
  </div></div>

  <div id="purchaseRecvModal" class="modal"><div class="box" style="width:min(720px,100%)">
    <div class="mhd"><strong id="purchaseRecvModalTitle">收货录入</strong><button type="button" id="closePurchaseRecvModal" class="btn-s btn-mini">关闭</button></div>
    <div class="mbd">
      <div class="row">
        <div class="field" style="flex:1"><label>收货单号</label><input id="purRecvNo" readonly /></div>
        <div class="field" style="flex:1"><label>关联采购订单</label><select id="purRecvPo"></select></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>供应商</label><input id="purRecvSupplier" readonly /></div>
        <div class="field" style="flex:1"><label>收货日期</label><input id="purRecvDate" type="date" /></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label class="erp-ctl-inline"><input type="checkbox" id="purRecvAutoStock" checked /> <span>自动转入库存（通过库存流水增加数量）</span></label></div>
      <div class="wrap"><table class="order-items-table"><thead><tr><th>产品名称</th><th>应收数量</th><th>实收数量</th><th>差异</th></tr></thead><tbody id="purRecvLinesBody"></tbody></table></div>
    </div>
    <div class="mft">
      <button type="button" id="purRecvCancel" class="btn-s">取消</button>
      <button type="button" id="purRecvSave" class="btn-p">确认收货</button>
    </div>
  </div></div>

  <div id="purchasePayModal" class="modal"><div class="box" style="width:min(440px,100%)">
    <div class="mhd"><strong>登记付款</strong><button type="button" id="closePurchasePayModal" class="btn-s btn-mini">关闭</button></div>
    <div class="mbd">
      <div class="field"><label>本次付款金额 *</label><input id="purPayAmount" type="number" min="0" step="0.01" /></div>
      <div class="field"><label>备注</label><input id="purPayNote" placeholder="可选" /></div>
    </div>
    <div class="mft"><button type="button" id="purPayCancel" class="btn-s">取消</button><button type="button" id="purPayConfirm" class="btn-p">确认登记</button></div>
  </div></div>

  <div id="purchaseDetailModal" class="modal"><div class="box" style="width:min(640px,100%)">
    <div class="mhd"><strong id="purchaseDetailTitle">详情</strong><button type="button" id="closePurchaseDetailModal" class="btn-s btn-mini">关闭</button></div>
    <div class="mbd" id="purchaseDetailBody"></div>
    <div class="mft"><button type="button" id="purchaseDetailCloseBtn" class="btn-p">知道了</button></div>
  </div></div>

  <div id="shipModal" class="modal"><div class="box" style="width:min(680px,100%)">
    <div class="mhd"><strong>新增发货</strong><button id="closeShipModal" class="btn-s btn-mini" type="button">关闭</button></div>
    <div class="mbd">
      <div class="row">
        <div class="field" style="flex:1"><label>发货日期</label><input id="shipDate" type="date" /></div>
        <div class="field" style="flex:1"><label>送货单号</label><input id="shipNo" /></div>
      </div>
      <div id="shipItems"></div>
      <button id="addShipItem" class="btn-s btn-mini" type="button" style="margin-top:8px">+ 添加下一项</button>
    </div>
    <div class="mft"><button id="cancelShip" class="btn-s" type="button">取消</button><button id="saveShip" class="btn-p" type="button">保存发货</button></div>
  </div></div>

  <div id="invModalInbound" class="modal"><div class="box">
    <div class="mhd inv-mhd"><strong>入库</strong><button type="button" class="inv-mhd-x inv-inv-close" data-inv-modal="invModalInbound" aria-label="关闭">×</button></div>
    <div class="mbd">
      <fieldset class="inv-form-section">
        <legend class="inv-form-section-h">产品</legend>
        <div class="field"><label>产品名称 *</label><input type="text" id="invInName" placeholder="必填" autocomplete="off" /></div>
        <div id="invInDupHint" class="inv-dup-hint" aria-live="polite"></div>
        <div class="field"><label>型号</label><input type="text" id="invInSku" placeholder="选填" autocomplete="off" /></div>

      shipItems:$("shipItems"), addShipItem:$("addShipItem"), saveShip:$("saveShip")
    };
    const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    /** img/video src 等：只转义 & 与 "，避免 data URL / http URL 中的合法字符被误转义导致无法加载 */
    const invAttrSrc = s => String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
    const n = v => Api.safeNumber(v);
    const fmtQ = v => { const x=n(v).toFixed(2); return x.endsWith(".00")?String(parseInt(x,10)):x; };
    const fmtM = v => n(v).toFixed(2);
    const md = v => n(v).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
    const month = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
    function orderCreatedMonthKey(o){
      const d=new Date(o.created_at||"");
      if(isNaN(d.getTime())) return "";
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    }
    function fmtOrderListWhen(iso){
      const d=new Date(iso||"");

      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function desktopOrdersFiltered(){
      const q=String(st.orderListQuery||"").trim().toLowerCase();
      const stF=String(st.orderListStatus||"").trim();
      const mo=String(st.orderListDate||"").trim();
      return st.orders.filter(o=>{
        if(stF && Api.deriveOrderStatus(o)!==stF) return false;
        if(mo && orderCreatedMonthKey(o)!==mo) return false;
        if(!q) return true;
        const cust=String(o.customer_name||"").toLowerCase();
        const cno=String(o.contract_no||"").toLowerCase();
        return cust.includes(q)||cno.includes(q);
      });
    }
    const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
    const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

    const tagCls = s => s==="done"?"t-done":(s==="shipped"?"t-shipped":"t-pending");
    const ord = id => st.orders.find(o=>o.id===id);

    const ships = id => ([...(ord(id)?.shipments||[])].sort((a,b)=>a.shipped_at<b.shipped_at?1:-1));
    const productKey = v => String(v||"").trim();
    const shippedMap = id => {
      const m = {};
      ships(id).forEach(s => (s.items||[]).forEach(i => {
        const k = productKey(i.product_name);
        if(!k) return;
        m[k] = n(m[k]) + n(i.quantity_shipped);
      }));
      return m;
    };
    const progress = o => {
      const map = shippedMap(o.id);
      const t = (o.order_items||[]).reduce((s,i)=>s+n(i.quantity),0);
      const sh = (o.order_items||[]).reduce((s,i)=>s+Math.min(n(i.quantity),n(map[productKey(i.product_name)])),0);
      const p = t>0?Math.max(0,Math.min(100,Math.round(sh/t*100))):0;
      return {t,sh,p};
    };

    function isValidAuthEmail(s){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||"").trim());}
    function authFriendlyError(err){
      const code=String(err?.code||"");

      if(low.includes("redirect")||low.includes("redirect_uri")||low.includes("redirect url")||(low.includes("url")&&low.includes("not")))
        return"邮件回跳地址未通过校验：打开 Supabase → Authentication → URL Configuration，把浏览器地址栏里的完整地址（含端口和 index.html）加到 Redirect URLs。";
      if(low.includes("rate limit")||low.includes("too many")||low.includes("too_many"))
        return"发信太频繁，请隔几分钟再试。";
      if(code==="user_already_registered"||low.includes("already registered")||low.includes("user already registered"))return"该邮箱已注册，请切换到登录。";
      if(low.includes("already been registered"))return"该邮箱已注册，请切换到登录。";
      if(low.includes("password")&&(low.includes("6")||low.includes("least")||low.includes("short")||low.includes("characters")))return"密码长度不足，请至少使用 6 位。";
      if(low.includes("invalid login credentials"))return"邮箱或密码不正确。";
      if(low.includes("invalid email"))return"邮箱格式不正确。";
      if(low.includes("signups not allowed")||low.includes("signup disabled"))return"项目已关闭自助注册，需在 Supabase 控制台开启。";
      return msg||"请求失败，请稍后重试。";
    }

    function toggleAuth(sess){

    function buildRows(m){

          if(!s.shipped_at||!s.shipped_at.startsWith(m))return;

    }

    function buildStatementRowsByFilter(m, customerId){
      const cust = st.customers.find(c=>String(c.id)===String(customerId));
      const customerName = String(cust?.name || cust?.customer_name || "").trim();
      const rows=[];
      st.orders.forEach(o=>{
        if(customerName && String(o.customer_name||"").trim() !== customerName) return;
        const map={};
        (o.order_items||[]).forEach(i=>map[i.product_name]=i);
        (o.shipments||[]).forEach(s=>{
          if(!s.shipped_at||!s.shipped_at.startsWith(m))return;
          (s.items||[]).forEach(i=>{
            const q=n(i.quantity_shipped);
            if(q<=0)return;
            const p=map[i.product_name]||{};
            const u=n(p.unit_price);
            rows.push({shipped_at:s.shipped_at,shipment_no:s.shipment_no,contract_no:o.contract_no,product_name:i.product_name,product_spec:p.product_spec||"",quantity:q,unit_price:u,amount:q*u})
          })

    function upper(amount){const a=["零","壹","贰","叁","肆","伍","陆","柒","捌","玖"],r=["","拾","佰","仟"],u=["","万","亿","兆"],d=["角","分"];const m=n(amount);if(m===0)return"零元整";const [i,dc]=m.toFixed(2).split(".");let s="";if(parseInt(i,10)>0){let z=0;for(let x=0;x<i.length;x++){const nn=i.substring(x,x+1),p=i.length-x-1,q=Math.floor(p/4),mm=p%4;if(nn==="0"){z++}else{if(z>0)s+=a[0];z=0;s+=a[parseInt(nn,10)]+r[mm]}if(mm===0&&z<4)s+=u[q]}s+="元"}if(dc!=="00"){for(let x=0;x<dc.length;x++){const nn=dc.substring(x,x+1);if(nn!=="0")s+=a[parseInt(nn,10)]+d[x]}}else s+="整";return s}

    /** 状态：缺货(0) / 预警(0<c<=w) / 正常 */

      const c=Math.floor(n(cur)),w=Math.floor(n(warn));
      if(c===0)return{status:"缺货",cls:"inv-st-out",dot:"🔴",key:"out"};

      if(sq)arr=arr.filter(p=>{
        const nm=String(p.name||"").toLowerCase();
        const sk=String(p.sku||"").toLowerCase();
        return nm.includes(sq)||sk.includes(sq);
      });
      const cat=String(f.category||"").trim();
      if(cat&&cat!=="全部")arr=arr.filter(p=>String(p.category||"")===cat);
      const stf=String(f.status||"").trim();
      if(stf&&stf!=="全部"){
        arr=arr.filter(p=>{
          const cs=Math.floor(n(p.current_stock));
          const w=invEffectiveWarn(p);
          const t=invStatusOf(cs,w);
          if(stf==="缺货")return t.key==="out";
          if(stf==="预警")return t.key==="warn";
          if(stf==="正常")return t.key==="ok";
          return true;
        });
      }

    function invOverview(){
      invEnsure();

      st.inv.products.forEach(p=>{
        const c=Math.floor(n(p.current_stock));
        const w=invEffectiveWarn(p);
        const t=invStatusOf(c,w);
        totalQty+=c;
        if(t.key==="out")outOnly++;
        else if(t.key==="warn")warnOnly++;
      });
      st.inv.ledger.forEach(e=>{
        if(!e.time||!String(e.time).startsWith(td))return;
        const t=String(e.type||"");
        if(t==="入库"||t==="入库调整")todayIn+=Math.floor(n(e.quantity_delta));
        else if(t==="出库"||t==="出库调整")todayOut+=Math.abs(Math.floor(n(e.quantity_delta)));
        else if(t.indexOf("盘点")>=0||t==="盘点调整"){
          const d=Math.floor(n(e.quantity_delta));
          if(d>0)todayIn+=d;else if(d<0)todayOut+=Math.abs(d);

    /**
     * 产品型号/名称以「录入」为准：优先对接 Api.getProductByCode；再按本地 sku/名称精确匹配；
     * 若仍无匹配则本地新增一条产品（非「查找失败」拦截）。
     */
    async function invPrepareInboundProduct(typedText,categoryForNewRow){
      const c=String(typedText||"").trim();
      if(!c)return null;
      try{
        const r=await Api.getProductByCode(c);
        if(r&&!r.error&&r.data){
          const loc=st.inv.products.find(x=>String(x.sku).trim()===String(r.data.sku).trim());
          if(loc)return loc;
          if(!st.inv.products.some(x=>x.id===r.data.id))st.inv.products.push(r.data);
          return st.inv.products.find(x=>x.id===r.data.id)||r.data;
        }
      }catch(e){console.warn("[库存] getProductByCode",e);}
      let hit=st.inv.products.find(x=>String(x.sku).trim()===c);
      if(hit)return hit;
      hit=st.inv.products.find(x=>String(x.name).trim()===c);
      if(hit)return hit;
      const low=c.toLowerCase();
      const cand=st.inv.products.filter(x=>String(x.name).toLowerCase()===low||String(x.sku).toLowerCase()===low);
      if(cand.length===1)return cand[0];
      const p=invCreateAdhocProduct(c,categoryForNewRow);
      st.inv.products.push(p);
      return p;
    }
    /** 入库表单：按名称+型号解析或新建产品，并同步类型、单位 */
    function invCreateInboundAdhoc(name,sku,category,unit){
      const id="p-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const cat=String(category||"成品").trim()||"成品";
      const u=String(unit||"件").trim()||"件";
      const sk=sku==null||sku===undefined?"":String(sku).trim();
      return{
        id,sku:sk,name:String(name).trim(),category:cat,unit:u,
        default_warning_value:1,warning_level:1,warning_remark:"",current_stock:0,
        ref_price:0,sale_price:0,cost_price:0,warehouse_location:"",product_remark:"",image_urls:[],
        _adhoc:true
      };
    }
    async function invResolveInboundProduct(name,sku,categoryLabel,unit){
      const nm=String(name||"").trim(),sk=sku==null||sku===undefined?"":String(sku).trim();
      const u=(String(unit||"").trim())||"件";
      const cat=(String(categoryLabel||"成品").trim())||"成品";
      if(!nm)return null;
      try{
        if(sk){
          const r=await Api.getProductByCode(sk);
          if(r&&!r.error&&r.data){
            const loc=st.inv.products.find(x=>String(x.sku).trim()===String(r.data.sku).trim());
            if(loc){loc.name=nm;loc.unit=u;loc.category=cat;return loc;}
            if(!st.inv.products.some(x=>x.id===r.data.id))st.inv.products.push(r.data);
            const pl=st.inv.products.find(x=>x.id===r.data.id)||r.data;
            pl.name=nm;pl.sku=sk;pl.unit=u;pl.category=cat;
            return pl;
          }
        }
      }catch(e){console.warn("[库存] getProductByCode",e);}
      let hit=sk?st.inv.products.find(x=>String(x.sku).trim()===sk):null;
      if(hit){hit.name=nm;hit.unit=u;hit.category=cat;return hit;}
      hit=st.inv.products.find(x=>String(x.name).trim()===nm);
      if(hit){hit.sku=sk;hit.unit=u;hit.category=cat;return hit;}
      const low=nm.toLowerCase();
      const cand=st.inv.products.filter(x=>String(x.name).toLowerCase()===low);
      if(cand.length===1){const h=cand[0];h.sku=sk;h.unit=u;h.category=cat;return h;}
      const p=invCreateInboundAdhoc(nm,sk,cat,u);
      st.inv.products.push(p);
      return p;
    }

    function invIsProductUsedInOrders(p){
      const nm=String(p.name||"").trim(),sk=String(p.sku||"").trim();
      return st.orders.some(o=>(o.order_items||[]).some(it=>{
        const pn=String(it.product_name||"").trim();
        return pn&&(pn===nm||pn===sk);
      }));
    }
    function invIsProductBlockedByPurchase(p){
      if(st.inv.purchaseRefIds&&st.inv.purchaseRefIds[p.id])return true;
      purchaseEnsure();
      const nm=String(p.name||"").trim(),sk=String(p.sku||"").trim();
      return (st.purchase.orders||[]).some(po=>{
        if(po.status==="cancelled")return false;
        return (po.lines||[]).some(l=>{
          const pn=String(l.productName||"").trim();
          return pn&&(pn===nm||pn===sk||(!nm&&pn===sk));
        });
      });
    }

    async function invDetailSaveFromForm(){
      invEnsure();
      const pid=($("invDetPid")?.value||"").trim()||st.inv.detailUi?.pid;
      if(!pid)return;
      const p=st.inv.products.find(x=>x.id===pid);
      if(!p)return;
      const nm=($("invDetName")?.value||"").trim();
      const sku=($("invDetSku")?.value||"").trim();
      const cat=($("invDetCat")?.value||"").trim();
      const unit=($("invDetUnit")?.value||"").trim();
      const wLev=Math.max(0,Math.floor(n($("invDetWarn")?.value)));
      const wRm=($("invDetWarnRemark")?.value||"").trim();
      const price=n($("invDetPrice")?.value);
      const remark=($("invDetRemark")?.value||"").trim();
      if(!nm||!sku){alert("请填写产品名称与型号");return;}
      try{
        const dbPid=Api.getInventoryProductCloudId(p);
        let imageUrls=null;
        if(st.inv._detailNewImageDataUrl){
          if(typeof Api.uploadInventoryImageFromDataUrl==="function"){
            imageUrls=[await Api.uploadInventoryImageFromDataUrl(st.inv._detailNewImageDataUrl,"product-edit")];
          }else{
            imageUrls=[st.inv._detailNewImageDataUrl];
          }
        }
        if(dbPid){
          await Api.updateInventoryProduct({productId:dbPid,name:nm,sku,category:cat,unit,ref_price:price,product_remark:remark,image_urls:imageUrls||undefined});
          await Api.updateProductWarning(dbPid,wLev,wRm);
        }else{
          console.warn("[产品详情] 无云端 UUID，已跳过 Supabase（仅本地字段）");
          if(imageUrls)p.image_urls=imageUrls;
        }
        st.inv._detailNewImageDataUrl=null;
        p.name=nm;p.sku=sku;p.category=cat||p.category;p.unit=unit||p.unit;
        p.ref_price=price;p.sale_price=price;p.cost_price=price;
        p.product_remark=remark;
        p.warning_level=wLev;p.default_warning_value=wLev;p.warning_remark=wRm;
        if(st.inv.detailUi)st.inv.detailUi.editing=false;
        invPersist();
        await invAfterMutationRefresh();
        invRefreshDetailModal();
      }catch(err){alert(Api.formatSupabaseError(err));}
    }

    async function submitMobileOrder(btn){
      const d = st.createDraft;
      const customer = st.customers.find(c=>c.id===d.customerId);
      const no = String(d.contractNo||"").trim();
      const it = (d.items||[]).map(i=>({
        product_name:String(i.product_name||"").trim(),
        product_spec:String(i.product_spec||"").trim(),
        quantity:n(i.quantity),
        unit_price:n(i.unit_price)
      })).filter(i=>i.product_name && i.quantity>0 && i.unit_price>=0);
      if(!customer){ mToast("请选择客户"); return; }
      if(!no){ mToast("请填写合同号"); return; }
      const duplicate = st.orders.find(o=>String(o.contract_no||"").trim()===no);
      if(duplicate){ mToast("合同号已存在，请使用唯一合同号"); return; }
      if(!it.length){ mToast("请至少填写一个有效产品"); return; }
      const payload = Api.normalizeOrder({customer_name:customer.name,customer_cloud_id:customer.cloud_id,contract_no:no,created_at:new Date().toISOString(),status:"pending",order_items:it,shipments:[]});
      await withBtnLoading(btn,"提交中...",async()=>{
        try{
          await Api.createOrUpdateCustomer(customer);
          await Api.createOrder(payload,st.customers);
          st.createDraft={customerId:"",contractNo:"",items:[{product_name:"",product_spec:"",quantity:"",unit_price:""}]};
          await refresh();
          goTo("ship","ship/list",{});
          mToast("订单已创建");
        }catch(err){
          alert(`订单保存失败：\n${Api.formatSupabaseError(err)}`);
        }
      });

    async function saveShipFromPage(orderId,btn){
      const o = ord(orderId);
      if(!o) return;
      const shipNo = (document.getElementById(`shipNoPage-${orderId}`)?.value||"").trim();
      const shipDate = (document.getElementById(`shipDatePage-${orderId}`)?.value||"").trim();
      if(!shipNo){ mToast("请填写发货单号"); return; }
      if(!shipDate){ mToast("请选择发货日期"); return; }
      const map = shippedMap(o.id);
      const shipItems = (o.order_items||[]).map((it,idx)=>({product_name:it.product_name,quantity_shipped:n(st.shipDraft.items[idx]?.quantity_shipped)})).filter(i=>i.quantity_shipped>0);
      if(!shipItems.length){ mToast("请至少填写一项发货数量"); return; }
      for(const item of shipItems){
        const oi = (o.order_items||[]).find(x=>x.product_name===item.product_name);
        const remain = Math.max(0,n(oi?.quantity)-Math.min(n(oi?.quantity),n(map[item.product_name])));
        if(item.quantity_shipped>remain){ mToast(`${item.product_name} 超出剩余数量`); return; }
      }
      const ship = { shipment_id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), shipment_no:shipNo, shipped_at:shipDate, items:shipItems };
      await withBtnLoading(btn,"提交中...",async()=>{
        try{
          await Api.createShipment(o,ship,st.customers);
          await refresh();
          st.shipDraft={orderId:"",shipped_at:"",shipment_no:"",items:[{product_name:"", quantity_shipped:""}]};
          mToast("发货成功");
        }catch(err){
          alert(`发货保存失败：\n${Api.formatSupabaseError(err)}`);
        }
      });
    }

      products.forEach(p=>{
        const cs=Math.floor(n(p.current_stock)), w=invEffectiveWarn(p);

        if(t.key==="out")stockOut++;
        else if(t.key==="warn")stockLow++;
      });
      const pending=st.orders.filter(o=>Api.deriveOrderStatus(o)==="pending").length;
      const activeOrders=st.orders.filter(o=>Api.deriveOrderStatus(o)!=="done").length;
      const shipped=st.orders.filter(o=>Api.deriveOrderStatus(o)==="shipped").length;
      const progressPct=activeOrders?Math.round((shipped/Math.max(activeOrders,1))*100):100;
      const m=st.statementMonth||month();
      const stmtRows=buildStatementRowsByFilter(m,"");
      const recvTotal=stmtRows.reduce((s,r)=>s+n(r.amount),0);
      const payDuePlaceholder=0;
      const warnRows=products.map(p=>{
        const cs=Math.floor(n(p.current_stock)), w=invEffectiveWarn(p);
        const t=invStatusOf(cs,w);
        return {p,cs,w,t};
      }).filter(x=>x.t.key!=="ok").sort((a,b)=>{
        const rk=(k)=>(k==="out"?0:k==="warn"?1:2);

            </div>
          </div>
          <div class="dash-kpi-card">
            <div class="dash-kpi-icon" style="background:#2563eb"><i data-lucide="activity"></i></div>
            <div class="dash-kpi-body">
              <p class="dash-kpi-label">订单履约进度</p>
              <p class="dash-kpi-value">${progressPct}%</p>
              <p class="dash-kpi-meta">进行中 ${activeOrders} · 待发货 ${pending}</p>
              <p class="dash-kpi-trend neutral">基于在途订单汇总</p>
            </div>
          </div>

    function purchaseUpsertPayableFromPo(po){
      purchaseEnsure();
      const amt=purPoSum(po);
      const existing=st.purchase.payables.find(p=>String(p.poId)===String(po.id));
      const row={
        id:existing?existing.id:purNewId("ap"),
        apNo:existing?existing.apNo:purGenApNo(),
        poId:po.id,
        poNo:po.poNo,
        supplierName:po.supplierName||"—",
        amount:amt,
        paid:n(existing?existing.paid:0),
        dueDate:(existing&&existing.dueDate)||String(po.createdAt||"").slice(0,10),
        status:"unpaid",
        createdAt:existing?existing.createdAt:new Date().toISOString()
      };
      const unpaid=Math.max(0,n(row.amount)-n(row.paid));
      if(unpaid<=0.009)row.status="paid";
      else if(n(row.paid)>0)row.status="partial";
      else row.status="unpaid";
      const ix=st.purchase.payables.findIndex(x=>String(x.id)===String(row.id));
      if(ix>=0)st.purchase.payables[ix]=row;else st.purchase.payables.push(row);
    }

    async function purchaseApplyRecvToInventory(rec){
      invEnsure();
      const op=await invGetLedgerOperatorFields();
      const bizNo=String(rec.recvNo||rec.poNo||"无");
      for(const ln of rec.lines||[]){
        const rq=Math.floor(n(ln.receivedQty));
        if(rq<=0)continue;
        const nm=String(ln.productName||"").trim();
        if(!nm)continue;
        const pl=await invResolveInboundProduct(nm,"","成品",String(ln.unit||"件").trim()||"件");
        if(!pl)continue;
        const before=Math.floor(n(pl.current_stock));
        const after=before+rq;
        const remark=`采购收货 · ${bizNo}`;
        const dbPid=Api.getInventoryProductCloudId(pl);
        if(dbPid){
          try{
            await Api.createStockTransaction({
              productId:dbPid,
              quantity:rq,
              bizType:String(pl.category||"").trim(),
              remark,
              direction:"IN",
              source_type:"采购",
              target_type:"",
              biz_order_no:bizNo,
              purpose:"采购入库",
              inbound_subtype:"采购",

    async function purchaseSaveRecv(){
      purchaseEnsure();
      const poId=E.purRecvPo?.value||"";
      const po=st.purchase.orders.find(o=>String(o.id)===String(poId));
      if(!po){alert("请选择采购订单");return;}
      const recvDate=E.purRecvDate?.value||today();
      const auto=E.purRecvAutoStock?.checked!==false;
      const recvNo=E.purRecvNo?.value||purGenRecvNo();
      const lines=[...E.purRecvLinesBody?.querySelectorAll("tr[data-pur-recv-line]")||[]].map(tr=>{
        const productName=String(tr.getAttribute("data-product")||"").trim();
        const pl=(po.lines||[]).find(x=>String(x.productName)===productName);
        const expectedQty=n(pl?.qty);
        const receivedQty=n(tr.querySelector(".pur-recv-qty")?.value);
        return{productName,unit:pl?.unit||"件",expectedQty,receivedQty,diff:receivedQty-expectedQty};
      }).filter(l=>l.productName);
      let sumExp=0,sumR=0;
      lines.forEach(l=>{sumExp+=n(l.expectedQty);sumR+=n(l.receivedQty);});
      let status="pending";
      if(sumR<=0)status="pending";
      else if(sumExp>0&&sumR>=sumExp-0.0001)status="done";
      else if(sumR>0)status="partial";
      else status="pending";
      const rid=st.purchaseUi.recvDraft&&st.purchaseUi.recvDraft.id?st.purchaseUi.recvDraft.id:purNewId("rcv");
      const rec={
        id:rid,
        recvNo,
        poId:po.id,
        poNo:po.poNo,
        supplierName:po.supplierName||"",
        recvDate,
        status,
        stocked:false,
        autoStock:auto,
        lines
      };
      if(auto&&sumR>0){
        rec.stocked=true;
        await purchaseApplyRecvToInventory(rec);
      }
      const ix=st.purchase.receipts.findIndex(r=>r.id===rec.id);
      if(ix>=0)st.purchase.receipts[ix]=rec;else st.purchase.receipts.unshift(rec);
      if(status==="done"&&po.status!=="cancelled"&&po.status!=="completed"){
        po.status="completed";
        const i2=st.purchase.orders.findIndex(o=>o.id===po.id);
        if(i2>=0)st.purchase.orders[i2]=po;
      }
      purchasePersist();
      purchaseCloseRecvModal();
      render();
      mToast(auto&&sumR>0?"收货已记录并已计入库存流水":"收货已记录（未改库存）");
    }

    /** 产品中心：localStorage（products[] + bomItems[]） */
    function pcLsKey(){return st.cloudUserId?`erp_product_center_v1:${st.cloudUserId}`:"erp_product_center_v1:local";}
    function pcEnsure(){
      if(st.pc)return;
      try{
        const raw=localStorage.getItem(pcLsKey());
        const j=raw?JSON.parse(raw):{};
        st.pc={products:Array.isArray(j.products)?j.products:[],bomItems:Array.isArray(j.bomItems)?j.bomItems:[]};
      }catch(_){ st.pc={products:[],bomItems:[]}; }
    }

    function pcNewBid(){return "bi_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);}
    function pcById(id){
      pcEnsure();
      return st.pc.products.find(x=>String(x.id)===String(id))||null;
    }
    function pcFmtDate(iso){
      if(!iso)return "—";
      try{
        const d=new Date(iso);
        if(isNaN(d.getTime()))return String(iso);
        const pad=n=>String(n).padStart(2,"0");
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }catch(_){ return String(iso); }
    }
    function pcBomLinesFor(pid){
      pcEnsure();
      return st.pc.bomItems.filter(x=>String(x.productId)===String(pid)).sort((a,b)=>(n(a.seq)-n(b.seq))||String(a.id).localeCompare(String(b.id)));
    }
    function pcMaterialCost(pid){
      return pcBomLinesFor(pid).reduce((s,r)=>s+n(r.qty)*n(r.unitPrice),0);
    }

    async function saveOrder(ev){
      ev.preventDefault();
      const cid = E.orderCustomer.value;
      const customer = st.customers.find(c=>c.id===cid);
      const no = E.orderNo.value.trim();
      const it = collectItems();
      if(!customer){ alert("请选择客户。"); return; }
      if(!no){ alert("请填写合同号"); return; }
      const duplicate = st.orders.find(o=>String(o.contract_no||"").trim()===no && String(o.id)!==String(st.editing||""));
      if(duplicate){ alert("合同号已存在，请使用唯一合同号"); return; }
      if(!it.length){ alert("请至少填写一条产品明细。"); return; }
      const base = st.editing ? ord(st.editing) : null;
      const payload = Api.normalizeOrder({
        ...base,
        id: base?.id || "",
        customer_name: customer.name,

        const vb=e.target.closest(".v-order"); if(vb){const id=vb.dataset.id;st.selected=id;st.expandedOrders[id]=!st.expandedOrders[id];render();return}
        if(e.target.id==="newOrderBtn"){openOrderModal(null);return}
        if(e.target.id==="newCustomerBtn"){openCustomerModal();return}
        if(e.target.id==="backBtn"){st.appState={tab:"orders",page:"orders/list",params:{}};render();return}
        if(e.target.id==="editOrderBtn"){const o=ord(st.selected);if(o)openOrderModal(o);return}
        if(e.target.id==="newShipBtn"){if(!st.selected)return;openShipModal(st.selected);return}
        if(e.target.id==="delOrderBtn"){const o=ord(st.selected);if(!o)return;if(!confirm(`确认删除订单 ${o.contract_no} 吗？`))return;try{await Api.deleteOrder(o.contract_no);st.selected="";st.appState={tab:"orders",page:"orders/list",params:{}};await refresh()}catch(err){alert(`删除订单失败：\n${Api.formatSupabaseError(err)}`)}return}
        const actionBtn=e.target.closest("[data-action][data-order-id]");
        if(actionBtn){
          const action=actionBtn.getAttribute("data-action"),id=actionBtn.getAttribute("data-order-id"),o=ord(id);
          if(!o)return;
          st.selected=id;
          if(action==="edit"){openOrderModal(o);return}
          if(action==="ship"){openShipModal(id);return}
          if(action==="delete"){
            if(!confirm(`确认删除订单 ${o.contract_no} 吗？`))return;
            try{await Api.deleteOrder(o.contract_no);delete st.expandedOrders[id];if(st.selected===id)st.selected="";st.appState={tab:"orders",page:"orders/list",params:{}};await refresh()}catch(err){alert(`删除订单失败：\n${Api.formatSupabaseError(err)}`)}
            return;
          }
        }
        const dc=e.target.closest(".del-c"); if(dc){const id=dc.dataset.id,c=st.customers.find(x=>x.id===id);if(!c)return;const cname=c.customer_name||c.name||"";const used=st.orders.some(o=>String(o.customer_name||"").trim()===String(cname).trim());if(used){alert("该客户已被订单引用，不能删除。");return}if(!confirm(`确认删除客户 ${cname} 吗？`))return;try{await Api.deleteCustomer(c.cloud_id);await refresh()}catch(err){alert(`删除客户失败：\n${Api.formatSupabaseError(err)}`)}return}
        if(e.target.id==="expBtn")exportX();
        if(e.target.id==="stmtGenBtn"){render();return}
      });
      document.body.addEventListener("input",e=>{
        if(e.target.id==="pcListSearch"){st.pcUi.listQ=e.target.value;pcScheduleListFilter();return}
        if(e.target.id==="pcProdThumb"){
          const f=e.target.files&&e.target.files[0];
          if(!f){st.pcUi._prodThumbDataUrl=null;return;}
          const r=new FileReader();
          r.onload=()=>{st.pcUi._prodThumbDataUrl=r.result;};
          r.readAsDataURL(f);
          return;
        }
        if(e.target.id==="invFilterSearch"){if(st.inv){st.inv.listFilter.searchQ=e.target.value;}invScheduleFilterRender();return}
        if(e.target.id==="invInName"){if(st.inv){st.inv._inboundPickPid=null;st.inv._inboundForceNew=false;}invScheduleInboundDupHint();return}
        if(e.target.id==="customerListSearch"){st.customerQuery=e.target.value||"";if(!isMobile()&&st.view==="customers")render();return}
        if(e.target.id==="supplierListSearch"){st.supplierQuery=e.target.value||"";if(!isMobile()&&st.view==="customers"&&erpMenuNormPath(st.erpPath)==="/customer/suppliers")render();return}
        if(e.target.id==="purPoSearch"){st.purchaseUi.poSearch=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        if(e.target.id==="purRecvSearch"){st.purchaseUi.recvSearch=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        if(e.target.id==="purApSearch"){st.purchaseUi.apSearch=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        if(e.target.classList&&e.target.classList.contains("pur-recv-qty")){
          const tr=e.target.closest("tr[data-pur-recv-line]");
          if(tr){
            const exp=n(tr.getAttribute("data-exp"));
            const rcv=n(e.target.value);
            const df=rcv-exp;
            const dc=tr.querySelector(".pur-diff");
            if(dc)dc.textContent=fmtQ(df);
          }
          return;
        }
        if(e.target.id==="orderListSearch"){st.orderListQuery=e.target.value||"";if(!isMobile()&&st.view==="orders")render();return}
        if(e.target.id==="orderListDate"){st.orderListDate=e.target.value||"";if(!isMobile()&&st.view==="orders")render();return}
        if(e.target.id==="mCustomerSearch"){st.customerQuery=e.target.value||"";if(isMobile()&&st.appState.tab==="customers")renderMobile();return}
        if(isMobile() && st.appState.tab==="orders"){
          const nameIdx=e.target?.getAttribute?.("data-mi-name");
          const specIdx=e.target?.getAttribute?.("data-mi-spec");
          const qtyIdx=e.target?.getAttribute?.("data-mi-qty");
          const priceIdx=e.target?.getAttribute?.("data-mi-price");
          if(nameIdx!==null && nameIdx!==undefined){
            st.createDraft.items[n(nameIdx)]={...st.createDraft.items[n(nameIdx)],product_name:e.target.value};
            updateMobileOrderTotal();
            return;
          }
          if(specIdx!==null && specIdx!==undefined){
            st.createDraft.items[n(specIdx)]={...st.createDraft.items[n(specIdx)],product_spec:e.target.value};
            updateMobileOrderTotal();
            return;
          }
          if(qtyIdx!==null && qtyIdx!==undefined){
            st.createDraft.items[n(qtyIdx)]={...st.createDraft.items[n(qtyIdx)],quantity:e.target.value};
            updateMobileOrderTotal();
            return;
          }
          if(priceIdx!==null && priceIdx!==undefined){
            st.createDraft.items[n(priceIdx)]={...st.createDraft.items[n(priceIdx)],unit_price:e.target.value};
            updateMobileOrderTotal();
            return;
          }
        }
        const input=e.target.closest("[data-field]");
        if(!input||!st.editingCustomerId)return;
        const field=input.getAttribute("data-field");
        if(field && st.customerEditFormData[field]!==undefined)st.customerEditFormData[field]=input.value;
        const sin=e.target.closest("[data-sfield]");
        if(sin&&st.editingSupplierId){
          const f=sin.getAttribute("data-sfield");
          if(f&&st.supplierEditFormData[f]!==undefined)st.supplierEditFormData[f]=sin.value;
        }
      });
      document.body.addEventListener("change",e=>{
        if(e.target.name==="invModOp"){invSyncModStockUi();return}
        if(e.target.id==="invFilterCategory"){if(st.inv){st.inv.listFilter.category=e.target.value;}render();return}
        if(e.target.id==="invFilterStatus"){if(st.inv){st.inv.listFilter.status=e.target.value;}render();return}
        if(e.target.id==="invInCat"){invSyncInboundOther($("invInCat"),$("invInCatOther"));return}
        if(e.target.id==="invInUnitSel"){invSyncInboundOther($("invInUnitSel"),$("invInUnitOther"));return}
        if(e.target.id==="invInSourceType"){invSyncInboundOther($("invInSourceType"),$("invInSourceOther"));return}
        if(e.target.id==="invInPurpose"){invSyncInboundOther($("invInPurpose"),$("invInPurposeOther"));return}
        if(e.target.id==="invModInSourceType"){invSyncInboundOther($("invModInSourceType"),$("invModInSourceOther"));return}
        if(e.target.id==="invModInPurpose"){invSyncInboundOther($("invModInPurpose"),$("invModInPurposeOther"));return}
        if(e.target.id==="invModOutTargetType"){invSyncInboundOther($("invModOutTargetType"),$("invModOutTargetOther"));return}
        if(e.target.id==="invModOutPurpose"){invSyncInboundOther($("invModOutPurpose"),$("invModOutPurposeOther"));return}
        if(e.target.id==="invInImage"){
          const f=e.target.files&&e.target.files[0];
          const nm=$("invInImgName");
          if(!f){st.inv._inboundImage=null;if(nm)nm.textContent="";return;}
          const r=new FileReader();
          r.onload=()=>{
            st.inv._inboundImage={name:f.name,type:f.type,size:f.size,dataUrl:r.result};
            if(nm)nm.textContent=f.name||"";
          };
          r.readAsDataURL(f);
          return;
        }
        if(e.target.id==="invDetImage"){
          const f=e.target.files&&e.target.files[0];
          if(!f){st.inv._detailNewImageDataUrl=null;return;}
          const r=new FileReader();
          r.onload=()=>{
            st.inv._detailNewImageDataUrl=r.result;
            const prev=$("invDetImgPreview");
            if(prev){prev.src=r.result;}
            else{
              const slot=$("invDetImgSlot");
              if(slot)slot.innerHTML=`<img class="inv-detail-img" src="${r.result}" alt="" id="invDetImgPreview">`;
            }
            console.log("[产品详情] 编辑模式已选新图（模拟）", f.name);
          };
          r.readAsDataURL(f);
          return;
        }
        if(e.target.id==="stmtCustomer"){
          st.statementCustomerId = e.target.value || "";
          render();
          return;
        }
        if(e.target.id==="monthInput"){st.statementMonth=e.target.value||month();render();return}
        if(e.target.id==="orderListStatus"){st.orderListStatus=e.target.value||"";if(!isMobile()&&st.view==="orders")render();return}
        if(e.target.id==="orderListDate"){st.orderListDate=e.target.value||"";if(!isMobile()&&st.view==="orders")render();return}
        if(e.target.id==="purPoStatus"){st.purchaseUi.poStatus=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        if(e.target.id==="purRecvStatusF"){st.purchaseUi.recvStatus=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        if(e.target.id==="purRecvStockedF"){st.purchaseUi.recvStocked=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        if(e.target.id==="purApStatusF"){st.purchaseUi.apStatus=e.target.value||"";if(!isMobile()&&st.view==="purchase")render();return}
        const nameIdx=e.target.getAttribute("data-mi-name"),specIdx=e.target.getAttribute("data-mi-spec"),qtyIdx=e.target.getAttribute("data-mi-qty"),priceIdx=e.target.getAttribute("data-mi-price"),shipIdx=e.target.getAttribute("data-si-qty");
        if(nameIdx!==null){st.createDraft.items[n(nameIdx)]={...st.createDraft.items[n(nameIdx)],product_name:e.target.value};updateMobileOrderTotal();return}
        if(specIdx!==null){st.createDraft.items[n(specIdx)]={...st.createDraft.items[n(specIdx)],product_spec:e.target.value};updateMobileOrderTotal();return}
        if(qtyIdx!==null){st.createDraft.items[n(qtyIdx)]={...st.createDraft.items[n(qtyIdx)],quantity:e.target.value};updateMobileOrderTotal();return}
        if(priceIdx!==null){st.createDraft.items[n(priceIdx)]={...st.createDraft.items[n(priceIdx)],unit_price:e.target.value};updateMobileOrderTotal();return}
        if(shipIdx!==null){st.shipDraft.items[n(shipIdx)]={...st.shipDraft.items[n(shipIdx)],quantity_shipped:e.target.value};return}
      });
      window.addEventListener("resize",()=>render());
    }
    let realtimeUnsub=null;
    async function wireRealtimeSubscription(){
      if(realtimeUnsub){
        realtimeUnsub.unsubscribe();
        realtimeUnsub=null;
      }
      const sess=await Api.getSession();
      if(!sess?.user)return;
      realtimeUnsub=await Api.subscribeCloudChanges(async()=>{
        if(E.app.classList.contains("hidden"))return;
        await refresh();
      });
    }
    async function initForSession(sess){
      toggleAuth(sess);
      if(!sess)return;
      if(window.ErpRouter)ErpRouter.safeDefaultHash();
      try{await Api.checkConnection()}catch(err){alert(`Supabase 连接失败：\n${Api.formatSupabaseError(err)}`)}
      await refresh();
    }
    async function init(){
      st.statementMonth=month();
      bind();
      authSetMode("login");
      const hadAuthHash=!!(window.location.hash&&window.location.hash.length>1&&(window.location.hash.includes("access_token")||window.location.hash.includes("type=")));
      const sess=await Api.getSession();
      consumeAuthRedirectNotice(sess,hadAuthHash);
      await initForSession(sess);
      await wireRealtimeSubscription();
      Api.onAuthStateChange(async s=>{
        toggleAuth(s);
        if(s){
          await refresh();
          await wireRealtimeSubscription();
        }else if(realtimeUnsub){
          realtimeUnsub.unsubscribe();
          realtimeUnsub=null;
        }
      });
    }
    init().catch(e=>console.warn("[init]",e));
  </script>
</body>
</html>
